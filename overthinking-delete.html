<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잡념 비우기</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            background: #f5faf2;
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 0;
            width: min(42vmin, 24.5rem);
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(10px);
            background: radial-gradient(
                circle at 50% 50%,
                #a8d98c 0%,
                rgba(168, 217, 140, 0.78) 38%,
                rgba(200, 232, 180, 0.28) 64%,
                transparent 78%
            );
        }

        body.is-on::before {
            animation: orbGrow 2.8s ease-out forwards;
        }

        @keyframes orbGrow {
            0% {
                width: min(42vmin, 24.5rem);
                filter: blur(10px);
            }
            100% {
                width: min(168vmin, 88rem);
                filter: blur(64px);
            }
        }

        .ui-wrapper {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 18px;
            width: min(420px, 100%);
            z-index: 10;
            position: relative;
            filter: saturate(1.08) contrast(1.08);
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            width: 100%;
        }

        .input-row input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 6px 0 8px;
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            font-size: 32px;
            line-height: 1.2;
            border: none;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.92);
            text-shadow: 0 1px 10px rgba(44, 54, 64, 0.18);
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            outline: none;
            color: #ffffff;
        }

        .input-row input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.78);
            font-size: 15px;
            line-height: 2.1;
        }

        .input-row button {
            padding: 0 0 8px;
            border: none;
            border-radius: 0;
            background: none;
            color: #ffffff;
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            font-size: 15px;
            font-weight: 600;
            font-style: normal;
            letter-spacing: -0.02em;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: none;
        }

        .input-row button:hover {
            opacity: 0.65;
        }

        .custom-card {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            gap: 1.05rem;
            padding: 0.15rem 0 0;
        }

        .mode-icons {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 1.7rem;
        }

        .mode-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: rgba(255, 255, 255, 0.64);
            text-underline-offset: 0.32em;
        }

        .mode-btn:hover {
            color: rgba(255, 255, 255, 0.78);
        }

        .mode-btn.active {
            color: #ffffff;
            text-decoration: underline;
        }

        .style-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.2rem;
        }

        .tone-dots,
        .weight-dots {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.55rem;
        }

        .tone-dot,
        .weight-dot {
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
        }

        .tone-dot {
            width: 0.78rem;
            height: 0.78rem;
            border-radius: 50%;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
            opacity: 0.78;
        }

        .tone-dot:hover,
        .tone-dot.is-on {
            opacity: 1;
            transform: scale(1.12);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
        }

        .weight-dot {
            width: 0.42rem;
            height: 0.42rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.58);
        }

        .weight-dot[data-size="22"] { width: 0.34rem; height: 0.34rem; }
        .weight-dot[data-size="32"] { width: 0.48rem; height: 0.48rem; }
        .weight-dot[data-size="48"] { width: 0.66rem; height: 0.66rem; }

        .weight-dot:hover,
        .weight-dot.is-on {
            background: #ffffff;
        }

        /* ------------------ 애니메이션 레이어 (화면 중앙 유지) ------------------ */
        .stage {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. 흘려보내기 */
        .anim-fade-flow,
        .anim-noise,
        .thought-break {
            position: absolute;
            left: 50%;
            top: 36%;
            white-space: nowrap;
            transform: translate(-50%, -50%);
        }

        .anim-fade-flow {
            animation: flowAway 6.2s cubic-bezier(0.22, 0.62, 0.28, 1) forwards;
        }
        @keyframes flowAway {
            0%, 34% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 180px)), calc(-50% + var(--dy, -150px))) scale(0.22) rotate(var(--rot, 10deg)); filter: blur(8px); }
        }

        /* 2. 노이징 지우기 */
        .anim-noise {
            animation: noiseGlitch 5.8s ease-in-out forwards;
        }
        @keyframes noiseGlitch {
            0%, 32% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: none; text-shadow: none; }
            48% { opacity: 0.88; transform: translate(calc(-50% - 3px), calc(-50% + 2px)) skewX(6deg); filter: contrast(180%) blur(0.6px); text-shadow: 1px 0 rgba(255,80,80,0.45), -1px 0 rgba(80,80,255,0.4); }
            66% { opacity: 0.58; transform: translate(calc(-50% + 3px), calc(-50% - 2px)) skewX(-8deg); filter: contrast(220%) blur(2px); text-shadow: -2px 0 rgba(160,255,140,0.4), 2px 0 rgba(255,80,220,0.35); }
            84% { opacity: 0.28; transform: translate(calc(-50% - 4px), calc(-50% + 1px)) scale(0.94); filter: blur(5px); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.86); filter: blur(12px); }
        }

        /* 3. 깨뜨리기 */
        .play-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 0 28px 68px;
            filter: blur(3.5px);
            opacity: 0.72;
            pointer-events: none;
            transition: filter 0.9s ease, opacity 0.9s ease;
        }

        body.is-playing .play-layer {
            filter: blur(0);
            opacity: 1;
            pointer-events: auto;
        }

        .guide-copy {
            position: fixed;
            left: 50%;
            top: 16%;
            z-index: 20;
            width: min(36rem, 88vw);
            margin: 0;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .guide-copy.is-gone {
            opacity: 0;
            transform: translateX(-50%) translateY(-14px);
        }

        .guide-copy p {
            margin: 0;
            color: #3f8a32;
            font-size: clamp(0.92rem, 1.35vw, 1.12rem);
            line-height: 1.85;
            letter-spacing: -0.025em;
            word-break: keep-all;
        }

        .guide-start {
            margin-top: 1.35rem !important;
            animation: spacePulse 1.55s ease-in-out infinite;
        }

        .guide-start b {
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            font-weight: 700;
        }

        @keyframes spacePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .shard {
            position: relative;
            display: inline-block;
            animation: shatter 6s cubic-bezier(0.16, 0.68, 0.24, 1) forwards;
        }
        @keyframes shatter {
            0%, 32% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); filter: blur(0); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.35); filter: blur(4px); }
        }
    </style>
</head>
<body>

    <div class="play-layer">
    <div class="stage" id="stage"></div>

    <div class="ui-wrapper">
        <!-- 박스 밖으로 분리된 입력창 & 버튼 -->
        <div class="input-row">
            <input type="text" id="thoughtInput" placeholder="비우고 싶은 생각을 적으세요" autocomplete="off">
            <button id="clearBtn">비우기</button>
        </div>

        <!-- 커스터마이징만 담긴 흰 박스 -->
        <div class="custom-card">
            <div class="mode-icons">
                <button type="button" class="mode-btn active" data-mode="flow">빛</button>
                <button type="button" class="mode-btn" data-mode="noise">노이즈</button>
                <button type="button" class="mode-btn" data-mode="break">조각</button>
            </div>

            <div class="style-controls">
                <div class="tone-dots" id="toneDots">
                    <button type="button" class="tone-dot" data-color="#ffffff" style="background:#ffffff" aria-label="하얀 빛"></button>
                    <button type="button" class="tone-dot" data-color="#e8f5dc" style="background:#e8f5dc" aria-label="옅은 결"></button>
                    <button type="button" class="tone-dot is-on" data-color="#a8d98c" style="background:#a8d98c" aria-label="초록 결"></button>
                    <button type="button" class="tone-dot" data-color="#7cc5e4" style="background:#7cc5e4" aria-label="푸른 결"></button>
                    <button type="button" class="tone-dot" data-color="#9896f1" style="background:#9896f1" aria-label="보라 결"></button>
                    <button type="button" class="tone-dot" data-color="#f59580" style="background:#f59580" aria-label="코랄 결"></button>
                    <button type="button" class="tone-dot" data-color="#f0d56e" style="background:#f0d56e" aria-label="노란 결"></button>
                    <button type="button" class="tone-dot" data-color="#2c3640" style="background:#2c3640" aria-label="먹빛"></button>
                </div>
                <div class="weight-dots" id="weightDots">
                    <button type="button" class="weight-dot" data-size="22" aria-label="작게"></button>
                    <button type="button" class="weight-dot is-on" data-size="32" aria-label="보통"></button>
                    <button type="button" class="weight-dot" data-size="48" aria-label="크게"></button>
                </div>
            </div>
        </div>
    </div>
    </div>
    <div class="guide-copy" id="guideCopy">
        <p>지금 비워내고 싶은 생각을 적어 빛으로, 노이즈로, 조각으로 사라집니다.</p>
        <p class="guide-start"><b>Space</b> 를 누르면 시작됩니다.</p>
    </div>

    <script>
        const input = document.getElementById('thoughtInput');
        const btn = document.getElementById('clearBtn');
        const stage = document.getElementById('stage');
        const modeButtons = document.querySelectorAll('.mode-btn');
        const toneDots = document.querySelectorAll('.tone-dot');
        const weightDots = document.querySelectorAll('.weight-dot');

        let currentMode = 'flow';
        let currentColor = '#a8d98c';
        let currentSize = 32;
        let started = false;
        let lastSlot = -1;
        const guideCopy = document.getElementById('guideCopy');
        const thoughtSlots = [
            { x: 22, y: 20 },
            { x: 50, y: 16 },
            { x: 76, y: 22 },
            { x: 30, y: 38 },
            { x: 68, y: 36 },
            { x: 18, y: 54 },
            { x: 52, y: 46 },
            { x: 80, y: 52 },
            { x: 40, y: 26 },
            { x: 60, y: 58 },
        ];

        function placeInSpace(el) {
            const choices = thoughtSlots
                .map((slot, index) => ({ slot, index }))
                .filter((item) => item.index !== lastSlot);
            const pick = choices[Math.floor(Math.random() * choices.length)];
            lastSlot = pick.index;
            const jitterX = (Math.random() - 0.5) * 8;
            const jitterY = (Math.random() - 0.5) * 7;
            el.style.left = `${pick.slot.x + jitterX}%`;
            el.style.top = `${pick.slot.y + jitterY}%`;
            const dir = pick.slot.x < 50 ? -1 : 1;
            el.style.setProperty('--dx', `${dir * (140 + Math.random() * 120)}px`);
            el.style.setProperty('--dy', `${-90 - Math.random() * 120}px`);
            el.style.setProperty('--rot', `${dir * (6 + Math.random() * 10)}deg`);
        }

        function beginThink() {
            if (started) return;
            started = true;
            document.body.classList.add('is-playing');
            guideCopy?.classList.add('is-gone');
            input?.focus?.({ preventScroll: true });
        }

        function syncPreview() {
            input.style.fontSize = currentSize + 'px';
            input.style.color = currentColor;
        }

        syncPreview();

        modeButtons.forEach(button => {
            button.addEventListener('click', () => {
                modeButtons.forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                currentMode = button.dataset.mode;
            });
        });

        toneDots.forEach((dot) => {
            dot.addEventListener('click', () => {
                toneDots.forEach((item) => item.classList.remove('is-on'));
                dot.classList.add('is-on');
                currentColor = dot.dataset.color;
                syncPreview();
            });
        });

        weightDots.forEach((dot) => {
            dot.addEventListener('click', () => {
                weightDots.forEach((item) => item.classList.remove('is-on'));
                dot.classList.add('is-on');
                currentSize = Number(dot.dataset.size);
                syncPreview();
            });
        });

        function clearThought() {
            const text = input.value.trim();
            if (!text) return;

            const size = currentSize + 'px';
            const color = currentColor;

            // 1. 흘려보내기
            if (currentMode === 'flow') {
                const el = document.createElement('div');
                el.className = 'anim-fade-flow';
                el.innerText = text;
                el.style.fontSize = size;
                el.style.color = color;
                placeInSpace(el);
                stage.appendChild(el);
                setTimeout(() => el.remove(), 6400);
            } 
            // 2. 노이징 지우기
            else if (currentMode === 'noise') {
                const el = document.createElement('div');
                el.className = 'anim-noise';
                el.innerText = text;
                el.style.fontSize = size;
                el.style.color = color;
                placeInSpace(el);
                stage.appendChild(el);
                setTimeout(() => el.remove(), 6000);
            } 
            // 3. 깨뜨리기
            else if (currentMode === 'break') {
                const wrapper = document.createElement('div');
                wrapper.className = 'thought-break';
                wrapper.style.display = 'flex';
                wrapper.style.fontSize = size;
                wrapper.style.color = color;
                wrapper.style.fontWeight = '700';
                placeInSpace(wrapper);

                [...text].forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'shard';
                    span.innerText = char;

                    const angle = Math.random() * Math.PI * 2;
                    const dist = 140 + Math.random() * 180;
                    span.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                    span.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
                    span.style.setProperty('--rot', `${(Math.random() - 0.5) * 360}deg`);

                    wrapper.appendChild(span);
                });

                stage.appendChild(wrapper);
                setTimeout(() => wrapper.remove(), 6200);
            }

            input.value = '';
        }

        btn.addEventListener('click', clearThought);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') clearThought();
        });

        window.stopThink = function () {
            started = false;
            document.body.classList.remove('is-on', 'is-playing');
            guideCopy?.classList.remove('is-gone');
            stage.innerHTML = '';
        };

        window.startThink = function () {
            if (!document.body.classList.contains('is-on')) {
                document.body.classList.add('is-on');
            }
        };

        window.beginThink = beginThink;

        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space' || event.key === ' ') {
                if (!started) {
                    event.preventDefault();
                    beginThink();
                }
            }
        });

        window.addEventListener('wheel', (event) => {
            event.preventDefault();
            parent.postMessage({ type: 'card-interact-wheel', deltaY: event.deltaY }, '*');
        }, { passive: false });
    </script>
</body>
</html>
