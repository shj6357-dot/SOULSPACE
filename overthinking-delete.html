<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잡념 비우기</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            background: #f5faf2;
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            overflow: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            inset: -18%;
            z-index: 0;
            pointer-events: none;
            opacity: .72;
            background:
                repeating-radial-gradient(ellipse at 50% 46%, transparent 0 72px, rgba(79,128,94,.055) 73px 74px, transparent 75px 138px),
                conic-gradient(from 218deg at 50% 46%, transparent 0 20%, rgba(171,214,173,.14) 27%, transparent 38% 62%, rgba(112,170,131,.09) 72%, transparent 84%);
            filter: blur(1px);
            animation: mindCurrent 24s ease-in-out infinite alternate;
        }

        @keyframes mindCurrent {
            0% { transform: translate3d(-1.5%, 1%, 0) rotate(-1deg) scale(.98); }
            100% { transform: translate3d(1.5%, -1%, 0) rotate(1deg) scale(1.04); }
        }

        body::before {
            content: "";
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 0;
            width: min(42vmin, 24.5rem);
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(10px);
            background: radial-gradient(
                circle at 50% 50%,
                #a8d98c 0%,
                rgba(168, 217, 140, 0.78) 38%,
                rgba(200, 232, 180, 0.28) 64%,
                transparent 78%
            );
        }

        body.is-on::before {
            animation: orbGrow 2.8s ease-out forwards;
        }

        @keyframes orbGrow {
            0% {
                width: min(42vmin, 24.5rem);
                filter: blur(10px);
            }
            100% {
                width: min(168vmin, 88rem);
                filter: blur(64px);
            }
        }

        .ui-wrapper {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 18px;
            width: min(420px, 100%);
            z-index: 10;
            position: relative;
            filter: saturate(1.08) contrast(1.08);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 10px 12px 10px 18px;
            border: 1px solid rgba(58, 104, 77, 0.24);
            border-radius: 18px;
            background: rgba(250, 253, 249, 0.72);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.86),
                0 12px 32px rgba(75, 116, 88, 0.13);
            backdrop-filter: blur(14px) saturate(0.92);
            -webkit-backdrop-filter: blur(14px) saturate(0.92);
            transition: border-color 0.28s ease, background 0.28s ease, box-shadow 0.28s ease;
        }

        .input-row:focus-within {
            border-color: rgba(48, 103, 70, 0.46);
            background: rgba(252, 254, 251, 0.86);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.94),
                0 14px 38px rgba(69, 117, 83, 0.18),
                0 0 0 3px rgba(137, 188, 148, 0.12);
        }

        .input-row input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 5px 0 6px;
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            font-size: 42px;
            line-height: 1.2;
            border: none;
            border-bottom: 1px solid rgba(55, 99, 72, 0.36);
            text-shadow: none;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            outline: none;
            color: #315446;
            caret-color: #315446;
        }

        .input-row input[type="text"]::placeholder {
            color: rgba(49, 84, 70, 0.62);
            font-size: 15px;
            line-height: 2.1;
        }

        .input-row button {
            padding: 8px 10px;
            border: none;
            border-radius: 0;
            background: none;
            color: #315446;
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            font-size: 15px;
            font-weight: 600;
            font-style: normal;
            letter-spacing: -0.02em;
            cursor: pointer;
            white-space: nowrap;
            border-radius: 999px;
            background: rgba(105, 157, 120, 0.12);
            box-shadow: inset 0 0 0 1px rgba(66, 112, 80, 0.12);
        }

        .input-row button:hover {
            opacity: 1;
            background: rgba(105, 157, 120, 0.2);
        }

        .custom-card {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            gap: 1.05rem;
            padding: 0.15rem 0 0;
        }

        .mode-icons {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 1.7rem;
        }

        .mode-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: rgba(255, 255, 255, 0.64);
            text-underline-offset: 0.32em;
        }

        .mode-btn:hover {
            color: rgba(255, 255, 255, 0.78);
        }

        .mode-btn.active {
            color: #ffffff;
            text-decoration: underline;
        }

        .style-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.2rem;
        }

        .tone-dots,
        .weight-dots {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.55rem;
        }

        .tone-dot,
        .weight-dot {
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
        }

        .tone-dot {
            width: 0.78rem;
            height: 0.78rem;
            border-radius: 50%;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
            opacity: 0.78;
        }

        .tone-dot:hover,
        .tone-dot.is-on {
            opacity: 1;
            transform: scale(1.12);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
        }

        .weight-dot {
            width: 0.42rem;
            height: 0.42rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.58);
        }

        .weight-dot[data-size="30"] { width: 0.34rem; height: 0.34rem; }
        .weight-dot[data-size="42"] { width: 0.48rem; height: 0.48rem; }
        .weight-dot[data-size="56"] { width: 0.66rem; height: 0.66rem; }

        .weight-dot:hover,
        .weight-dot.is-on {
            background: #ffffff;
        }

        /* ------------------ 애니메이션 레이어 (화면 중앙 유지) ------------------ */
        .stage {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage::before,
        .stage::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 42%;
            width: min(72vw, 820px);
            height: min(42vw, 430px);
            border: 1px solid rgba(69,116,84,.08);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-7deg);
            box-shadow: inset 0 0 90px rgba(143,195,149,.055);
        }

        .stage::after {
            width: min(54vw, 620px);
            height: min(31vw, 320px);
            transform: translate(-50%, -50%) rotate(8deg);
            opacity: .72;
        }

        /* 1. 흘려보내기 */
        .anim-fade-flow,
        .anim-noise,
        .thought-break {
            position: absolute;
            left: 50%;
            top: 36%;
            white-space: nowrap;
            transform: translate(-50%, -50%);
        }

        .anim-fade-flow {
            animation: flowAway 6.2s cubic-bezier(0.22, 0.62, 0.28, 1) forwards;
            text-shadow: 0 1px 12px rgba(255,255,255,.84), 0 10px 34px currentColor;
        }
        .anim-fade-flow::after {
            content: attr(data-echo);
            position: absolute;
            inset: 0;
            opacity: .18;
            filter: blur(5px);
            transform: translate(-18px, 16px) scaleX(1.12);
            animation: echoCurrent 6.2s ease-out forwards;
        }
        @keyframes flowAway {
            0%, 24% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); letter-spacing: -.02em; }
            58% { opacity: .72; filter: blur(1.3px); letter-spacing: .05em; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 180px)), calc(-50% + var(--dy, -150px))) scale(.5, .82) rotate(var(--rot, 10deg)); filter: blur(11px); letter-spacing: .22em; }
        }
        @keyframes echoCurrent {
            0%, 24% { opacity: .16; transform: translate(-18px, 16px) scaleX(1.12); }
            100% { opacity: 0; transform: translate(calc(var(--dx, 180px) * .42), calc(var(--dy, -150px) * .34)) scaleX(1.8); filter: blur(12px); }
        }

        /* 2. 노이징 지우기 */
        .anim-noise {
            animation: noiseGlitch 5.8s ease-in-out forwards;
        }
        @keyframes noiseGlitch {
            0%, 32% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: none; text-shadow: none; }
            48% { opacity: 0.88; transform: translate(calc(-50% - 3px), calc(-50% + 2px)) skewX(6deg); filter: contrast(180%) blur(0.6px); text-shadow: 1px 0 rgba(255,80,80,0.45), -1px 0 rgba(80,80,255,0.4); }
            66% { opacity: 0.58; transform: translate(calc(-50% + 3px), calc(-50% - 2px)) skewX(-8deg); filter: contrast(220%) blur(2px); text-shadow: -2px 0 rgba(160,255,140,0.4), 2px 0 rgba(255,80,220,0.35); }
            84% { opacity: 0.28; transform: translate(calc(-50% - 4px), calc(-50% + 1px)) scale(0.94); filter: blur(5px); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.86); filter: blur(12px); }
        }

        /* 3. 깨뜨리기 */
        .play-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 0 28px 68px;
            filter: blur(3.5px);
            opacity: 0.72;
            pointer-events: none;
            transition: filter 0.9s ease, opacity 0.9s ease;
        }

        body.is-playing .play-layer {
            filter: blur(0);
            opacity: 1;
            pointer-events: auto;
        }

        .guide-copy {
            position: fixed;
            left: 50%;
            top: 16%;
            z-index: 20;
            width: min(36rem, 88vw);
            margin: 0;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .guide-copy.is-gone {
            opacity: 0;
            transform: translateX(-50%) translateY(-14px);
        }

        .guide-copy p {
            margin: 0;
            color: #3f8a32;
            font-size: clamp(0.92rem, 1.35vw, 1.12rem);
            line-height: 1.85;
            letter-spacing: -0.025em;
            word-break: keep-all;
        }

        .guide-start {
            margin-top: 1.35rem !important;
            animation: spacePulse 1.55s ease-in-out infinite;
        }

        .guide-start b {
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            font-weight: 700;
        }

        @keyframes spacePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .shard {
            position: relative;
            display: inline-block;
            animation: shatter 6s cubic-bezier(0.16, 0.68, 0.24, 1) forwards;
        }
        @keyframes shatter {
            0%, 32% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); filter: blur(0); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.35); filter: blur(4px); }
        }

        /* S — 입력 도구와 선택 옵션을 배경에서 또렷하게 분리 */
        body {
            background:
                radial-gradient(ellipse 62% 52% at 50% 42%, rgba(181,222,168,.28), transparent 72%),
                linear-gradient(180deg, #f8fbf6 0%, #edf5ea 100%);
        }

        .play-layer {
            padding: 0 clamp(24px, 4vw, 64px) clamp(44px, 7vh, 78px);
        }

        .ui-wrapper {
            width: min(540px, 92vw);
            gap: 14px;
        }

        .interaction-caption {
            position: fixed;
            left: 50%;
            top: clamp(4.8rem, 10vh, 7rem);
            z-index: 12;
            width: min(38rem, 86vw);
            margin: 0;
            transform: translateX(-50%);
            color: #345c46;
            font-size: clamp(.88rem, 1.1vw, 1rem);
            font-weight: 500;
            line-height: 1.7;
            letter-spacing: -.02em;
            text-align: center;
            text-shadow: 0 1px 12px rgba(255,255,255,.9);
        }

        .input-row {
            padding: 13px 15px 13px 20px;
            border-color: rgba(45,91,63,.34);
            background: rgba(249,252,248,.9);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.96),
                0 16px 44px rgba(59,103,72,.14),
                0 0 0 1px rgba(255,255,255,.42);
        }

        .input-row input[type="text"] {
            border-bottom-color: rgba(48,88,62,.46);
            color: #274b39;
            caret-color: #274b39;
        }

        .input-row input[type="text"]::placeholder { color: rgba(39,75,57,.66); }

        .input-row button {
            padding: .62rem .9rem;
            color: #264c39;
            background: rgba(119,171,128,.16);
            box-shadow: inset 0 0 0 1px rgba(55,103,70,.18);
        }

        .custom-card {
            padding: .9rem 1.1rem .85rem;
            border-top: 1px solid rgba(48,88,62,.18);
            border-bottom: 1px solid rgba(255,255,255,.66);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.28) 18%, rgba(255,255,255,.28) 82%, transparent);
        }

        .mode-btn,
        .mode-btn:hover {
            color: rgba(42,78,58,.62);
        }

        .mode-btn.active {
            color: #284f3b;
            text-decoration-color: rgba(40,79,59,.5);
        }

        .tone-dot {
            box-shadow: inset 0 0 0 1px rgba(39,73,54,.26), 0 2px 6px rgba(46,78,58,.1);
        }

        .tone-dot:hover,
        .tone-dot.is-on {
            box-shadow: inset 0 0 0 1px rgba(35,68,49,.5), 0 0 0 3px rgba(255,255,255,.5);
        }

        .weight-dot { background: rgba(43,79,59,.42); }
        .weight-dot:hover,
        .weight-dot.is-on { background: #315d46; }

        @media (max-height: 680px) {
            .interaction-caption { top: 4.2rem; }
            .play-layer { padding-bottom: 28px; }
        }
body { background:linear-gradient(145deg,#f7faf5 10%,#e2efdf 50%,#f2f7ed 74%,#e0ebe1); }
    body::before,body.is-on::before { display:none; }
    body::after { background:linear-gradient(125deg,transparent 25%,rgba(255,255,255,.8) 42%,transparent 58%,rgba(121,163,136,.15) 77%,transparent 90%); filter:blur(32px); opacity:.8; }
    @media(max-width:1024px) {
      body { height:100svh; }
      .play-layer { padding:0 16px max(20px,env(safe-area-inset-bottom)); }
      .ui-wrapper { width:100%; max-width:540px; gap:12px; }
      .input-row { padding:10px 12px; gap:8px; }
      .input-row input[type="text"] { font-size:24px; }
      .input-row input[type="text"]::placeholder { font-size:13px; }
      .input-row button,.mode-btn { min-height:44px; }
      .interaction-caption { top:5rem; font-size:.84rem; }
    }
    @media(max-width:767px) {
      body::after { filter:blur(14px); opacity:.5; }
      .interaction-caption { top:4.65rem; width:84vw; font-size:.8rem; line-height:1.5; }
      .play-layer { padding-inline:14px; }
      .ui-wrapper { gap:9px; }
      .input-row { padding:8px 10px; }
      .input-row input[type="text"] { font-size:21px; }
      .custom-card { padding:9px 10px; }
    }
  </style>
</head>
<body>

    <div class="play-layer">
    <div class="stage" id="stage"></div>

    <p class="interaction-caption">지금 맴도는 생각을 적고 Enter를 눌러, 화면 너머로 흘려보내세요.</p>

    <div class="ui-wrapper">
        <!-- 박스 밖으로 분리된 입력창 & 버튼 -->
        <div class="input-row">
            <input type="text" id="thoughtInput" placeholder="비우고 싶은 생각을 적으세요" autocomplete="off">
            <button id="clearBtn">비우기</button>
        </div>

        <!-- 커스터마이징만 담긴 흰 박스 -->
        <div class="custom-card">
            <div class="mode-icons">
                <button type="button" class="mode-btn active" data-mode="flow">흐르기</button>
                <button type="button" class="mode-btn" data-mode="noise">흐리기</button>
                <button type="button" class="mode-btn" data-mode="break">흩어지기</button>
            </div>

            <div class="style-controls">
                <div class="tone-dots" id="toneDots">
                    <button type="button" class="tone-dot" data-color="#ffffff" style="background:#ffffff" aria-label="하얀 빛"></button>
                    <button type="button" class="tone-dot" data-color="#e8f5dc" style="background:#e8f5dc" aria-label="옅은 결"></button>
                    <button type="button" class="tone-dot is-on" data-color="#a8d98c" style="background:#a8d98c" aria-label="초록 결"></button>
                    <button type="button" class="tone-dot" data-color="#7cc5e4" style="background:#7cc5e4" aria-label="푸른 결"></button>
                    <button type="button" class="tone-dot" data-color="#9896f1" style="background:#9896f1" aria-label="보라 결"></button>
                    <button type="button" class="tone-dot" data-color="#f59580" style="background:#f59580" aria-label="코랄 결"></button>
                    <button type="button" class="tone-dot" data-color="#f0d56e" style="background:#f0d56e" aria-label="노란 결"></button>
                    <button type="button" class="tone-dot" data-color="#2c3640" style="background:#2c3640" aria-label="먹빛"></button>
                </div>
                <div class="weight-dots" id="weightDots">
                    <button type="button" class="weight-dot" data-size="30" aria-label="작게"></button>
                    <button type="button" class="weight-dot is-on" data-size="42" aria-label="보통"></button>
                    <button type="button" class="weight-dot" data-size="56" aria-label="크게"></button>
                </div>
            </div>
        </div>
    </div>
    </div>
    <div class="guide-copy" id="guideCopy">
        <p>지금 비워내고 싶은 생각을 적으면 빛과 결로 멀어집니다.</p>
        <p class="guide-start"><b>Space</b> 를 누르면 시작됩니다.</p>
    </div>

    <script>
        const input = document.getElementById('thoughtInput');
        const btn = document.getElementById('clearBtn');
        const stage = document.getElementById('stage');
        const modeButtons = document.querySelectorAll('.mode-btn');
        const toneDots = document.querySelectorAll('.tone-dot');
        const weightDots = document.querySelectorAll('.weight-dot');

        let currentMode = 'flow';
        let currentColor = '#a8d98c';
        let currentSize = 42;
        let started = false;
        let lastSlot = -1;
        let isComposing = false;
        let lastSubmitAt = 0;
        const guideCopy = document.getElementById('guideCopy');
        const thoughtSlots = [
            { x: 22, y: 20 },
            { x: 50, y: 16 },
            { x: 76, y: 22 },
            { x: 30, y: 38 },
            { x: 68, y: 36 },
            { x: 18, y: 54 },
            { x: 52, y: 46 },
            { x: 80, y: 52 },
            { x: 40, y: 26 },
            { x: 60, y: 58 },
        ];

        const paletteOverrides = ['#496b5d', '#668f76', '#a8d98c', '#7cc5e4', '#9896f1', '#f59580', '#a66f2f', '#2c3640'];
        toneDots.forEach((dot, index) => {
            if (!paletteOverrides[index]) return;
            dot.dataset.color = paletteOverrides[index];
            dot.style.background = paletteOverrides[index];
        });

        function placeInSpace(el) {
            const choices = thoughtSlots
                .map((slot, index) => ({ slot, index }))
                .filter((item) => item.index !== lastSlot);
            const pick = choices[Math.floor(Math.random() * choices.length)];
            lastSlot = pick.index;
            const jitterX = (Math.random() - 0.5) * 8;
            const jitterY = (Math.random() - 0.5) * 7;
            el.style.left = `${pick.slot.x + jitterX}%`;
            el.style.top = `${pick.slot.y + jitterY}%`;
            const dir = pick.slot.x < 50 ? -1 : 1;
            el.style.setProperty('--dx', `${dir * (140 + Math.random() * 120)}px`);
            el.style.setProperty('--dy', `${-90 - Math.random() * 120}px`);
            el.style.setProperty('--rot', `${dir * (6 + Math.random() * 10)}deg`);
        }

        function beginThink() {
            if (started) return;
            started = true;
            document.body.classList.add('is-playing');
            guideCopy?.classList.add('is-gone');
            input?.focus?.({ preventScroll: true });
        }

        function syncPreview() {
            input.style.fontSize = currentSize + 'px';
            input.style.color = '#315446';
        }

        syncPreview();

        modeButtons.forEach(button => {
            button.addEventListener('click', () => {
                modeButtons.forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                currentMode = button.dataset.mode;
            });
        });

        toneDots.forEach((dot) => {
            dot.addEventListener('click', () => {
                toneDots.forEach((item) => item.classList.remove('is-on'));
                dot.classList.add('is-on');
                currentColor = dot.dataset.color;
                syncPreview();
            });
        });

        weightDots.forEach((dot) => {
            dot.addEventListener('click', () => {
                weightDots.forEach((item) => item.classList.remove('is-on'));
                dot.classList.add('is-on');
                currentSize = Number(dot.dataset.size);
                syncPreview();
            });
        });

        function clearThought() {
            if (isComposing) return;
            const text = input.value.trim();
            if (!text) return;

            const now = performance.now();
            if (now - lastSubmitAt < 180) return;
            lastSubmitAt = now;

            const size = currentSize + 'px';
            const color = currentColor;

            // 1. 흘려보내기
            if (currentMode === 'flow') {
                const el = document.createElement('div');
                el.className = 'anim-fade-flow';
                el.innerText = text;
                el.dataset.echo = text;
                el.style.fontSize = size;
                el.style.color = color;
                placeInSpace(el);
                stage.appendChild(el);
                setTimeout(() => el.remove(), 6400);
            } 
            // 2. 노이징 지우기
            else if (currentMode === 'noise') {
                const el = document.createElement('div');
                el.className = 'anim-noise';
                el.innerText = text;
                el.style.fontSize = size;
                el.style.color = color;
                placeInSpace(el);
                stage.appendChild(el);
                setTimeout(() => el.remove(), 6000);
            } 
            // 3. 깨뜨리기
            else if (currentMode === 'break') {
                const wrapper = document.createElement('div');
                wrapper.className = 'thought-break';
                wrapper.style.display = 'flex';
                wrapper.style.fontSize = size;
                wrapper.style.color = color;
                wrapper.style.fontWeight = '700';
                placeInSpace(wrapper);

                [...text].forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'shard';
                    span.innerText = char;

                    const angle = Math.random() * Math.PI * 2;
                    const dist = 140 + Math.random() * 180;
                    span.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                    span.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
                    span.style.setProperty('--rot', `${(Math.random() - 0.5) * 360}deg`);

                    wrapper.appendChild(span);
                });

                stage.appendChild(wrapper);
                setTimeout(() => wrapper.remove(), 6200);
            }

            input.value = '';
        }

        btn.addEventListener('click', clearThought);
        input.addEventListener('compositionstart', () => { isComposing = true; });
        input.addEventListener('compositionend', () => { isComposing = false; });
        input.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            if (e.isComposing || isComposing || e.keyCode === 229) return;
            e.preventDefault();
            clearThought();
        });

        window.stopThink = function () {
            started = false;
            document.body.classList.remove('is-on', 'is-playing');
            guideCopy?.classList.remove('is-gone');
            stage.innerHTML = '';
            input.value = '';
            isComposing = false;
            lastSubmitAt = 0;
            lastSlot = -1;
            currentMode = 'flow';
            currentColor = '#a8d98c';
            currentSize = 42;
            modeButtons.forEach((item) => item.classList.toggle('active', item.dataset.mode === 'flow'));
            toneDots.forEach((item) => item.classList.toggle('is-on', item.dataset.color === '#a8d98c'));
            weightDots.forEach((item) => item.classList.toggle('is-on', Number(item.dataset.size) === 42));
            syncPreview();
        };

        window.startThink = function () {
            if (!document.body.classList.contains('is-on')) {
                document.body.classList.add('is-on');
            }
        };

        window.beginThink = beginThink;

        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space' || event.key === ' ') {
                if (!started) {
                    event.preventDefault();
                    beginThink();
                }
            }
        });

        window.addEventListener('wheel', (event) => {
            event.preventDefault();
            parent.postMessage({ type: 'card-interact-wheel', deltaY: event.deltaY }, '*');
        }, { passive: false });
    </script>
</body>
</html>
