<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soulspace — DRAINED</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            padding: 24px 28px 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: stretch;
            height: 100vh;
            background: #f5f4fb;
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            letter-spacing: -0.03em;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 0;
            width: min(42vmin, 24.5rem);
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(10px);
            background: radial-gradient(
                circle at 50% 50%,
                #9896f1 0%,
                rgba(152, 150, 241, 0.8) 38%,
                rgba(196, 194, 246, 0.3) 64%,
                transparent 78%
            );
        }

        body.is-on::before {
            animation: orbGrow 2.8s ease-out forwards;
        }

        @keyframes orbGrow {
            0% {
                width: min(42vmin, 24.5rem);
                filter: blur(10px);
            }
            100% {
                width: min(168vmin, 88rem);
                filter: blur(64px);
            }
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.12;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='cardGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23cardGrain)'/%3E%3C/svg%3E");
            background-size: 160px 160px;
        }

        .canvas-container {
            position: relative;
            z-index: 1;
            width: 100%;
            flex: 1;
            min-height: 0;
            background: transparent;
            overflow: hidden;
            cursor: crosshair;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls-bar {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 22px 4px 0;
            background: none;
        }

        .btn-group {
            display: flex;
            gap: 1.6rem;
        }

        .btn {
            background: none;
            border: none;
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            font-size: clamp(0.82rem, 1.35vw, 1.05rem);
            font-weight: 800;
            font-style: normal;
            color: #1c2228;
            cursor: pointer;
            padding: 0;
            letter-spacing: -0.03em;
        }
        .btn:hover {
            color: #1f1e33;
        }
        .btn.active {
            text-decoration: underline;
            text-underline-offset: 0.28em;
            color: #1f1e33;
        }

        .tempo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            font-size: clamp(0.82rem, 1.35vw, 1.05rem);
            font-weight: 800;
            font-style: normal;
            color: #1c2228;
            letter-spacing: -0.03em;
        }

        #tempoValue {
            min-width: 2.2em;
            font-variant-numeric: tabular-nums;
        }

        .tempo-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 132px;
            height: 1px;
            background: #3d3c58;
            outline: none;
        }

        .tempo-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 0;
            background: #3d3c58;
            cursor: pointer;
        }

        .play-layer {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            filter: blur(3.5px);
            opacity: 0.72;
            pointer-events: none;
            transition: filter 0.9s ease, opacity 0.9s ease;
        }

        body.is-playing .play-layer {
            filter: blur(0);

            pointer-events: auto;
        }

        .guide-copy {
            position: fixed;
            left: 50%;
            top: 16%;
            z-index: 20;
            width: min(36rem, 88vw);
            margin: 0;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .guide-copy.is-gone {
            opacity: 0;
            transform: translateX(-50%) translateY(-14px);
        }

        .guide-copy p {
            margin: 0;
            color: #4e4bb8;
            font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            font-size: clamp(0.92rem, 1.35vw, 1.12rem);
            line-height: 1.85;
            letter-spacing: -0.025em;
            word-break: keep-all;
        }

        .guide-start {
            margin-top: 1.35rem !important;
            animation: spacePulse 1.55s ease-in-out infinite;
        }

        .guide-start b {
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            font-weight: 700;
        }

        @keyframes spacePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        /* S — 소리 도구와 화면 조작부의 가독성 강화 */
        body {
            padding: 0;
            background:
                radial-gradient(ellipse 68% 56% at 50% 42%, rgba(184,182,236,.3), transparent 72%),
                linear-gradient(180deg, #f8f7fc 0%, #eeedf8 100%);
        }

        .play-layer {
            padding: clamp(24px, 4vw, 54px) clamp(26px, 4vw, 58px) clamp(22px, 3vw, 42px);
        }

        .interaction-caption {
            position: absolute;
            left: 50%;
            top: clamp(1.6rem, 5vh, 3.6rem);
            z-index: 4;
            width: min(38rem, 84vw);
            margin: 0;
            transform: translateX(-50%);
            color: #484777;
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            font-size: clamp(.88rem, 1.08vw, 1rem);
            font-weight: 500;
            line-height: 1.7;
            letter-spacing: -.02em;
            text-align: center;
            text-shadow: 0 1px 12px rgba(255,255,255,.92);
        }

        .canvas-container {
            margin-top: clamp(3.8rem, 9vh, 6rem);
            border: 1px solid rgba(80,77,145,.14);
            border-radius: 44% 56% 46% 54% / 54% 45% 55% 46%;
            background: radial-gradient(ellipse at 50% 52%, rgba(255,255,255,.26), rgba(220,218,247,.08) 60%, transparent 82%);
            box-shadow: inset 0 0 58px rgba(255,255,255,.34), 0 24px 60px rgba(89,84,159,.07);
        }

        canvas {
            filter: contrast(1.18) saturate(1.08) drop-shadow(0 10px 18px rgba(76,73,139,.08));
        }

        .controls-bar {
            align-items: center;
            margin-top: 1rem;
            padding: .9rem 1.15rem;
            border: 1px solid rgba(71,69,127,.2);
            border-radius: 999px;
            background: rgba(250,249,253,.68);
            box-shadow: 0 12px 34px rgba(76,71,140,.09), inset 0 1px 0 rgba(255,255,255,.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .btn {
            color: #41405f;
            font-size: clamp(.72rem, 1vw, .88rem);
            letter-spacing: .08em;
        }

        .btn:hover,
        .btn.active { color: #24233e; }

        .tempo-container {
            color: #41405f;
            font-size: clamp(.72rem, 1vw, .88rem);
            letter-spacing: .06em;
        }

        .tempo-slider { background: rgba(62,60,100,.54); }
        .tempo-slider::-webkit-slider-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #54518e;
            box-shadow: 0 0 0 4px rgba(122,118,188,.13);
        }

        @media (max-width: 700px) {
            .controls-bar { border-radius: 22px; align-items: flex-start; gap: 1rem; }
            .tempo-slider { width: 84px; }
        }

        /* U — 무뎌진 감각이 빛의 신호로 천천히 깨어나는 장면 */
        body {
            --awake: .18;
            background:
                radial-gradient(ellipse 54% 44% at 50% 48%, rgba(156,151,238,var(--awake)), transparent 72%),
                radial-gradient(ellipse 88% 68% at 50% 48%, rgba(219,217,249,.36), transparent 76%),
                linear-gradient(180deg, #faf9fd 0%, #eeedf8 100%);
        }

        body::after {
            opacity: .2;
            mix-blend-mode: normal;
            background:
                repeating-radial-gradient(ellipse at 50% 48%, transparent 0 74px, rgba(102,96,182,.055) 75px 76px, transparent 77px 142px),
                linear-gradient(120deg, transparent 22%, rgba(255,255,255,.38) 46%, transparent 68%);
            animation: dormantField 18s ease-in-out infinite alternate;
        }

        @keyframes dormantField {
            from { transform: translate3d(-1%, .6%, 0) scale(.99); }
            to { transform: translate3d(1%, -.6%, 0) scale(1.025); }
        }

        .canvas-container {
            border-color: rgba(80,77,145,.18);
            background:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,.36), transparent 30%),
                radial-gradient(ellipse at 50% 52%, rgba(255,255,255,.22), rgba(208,205,245,.1) 62%, transparent 84%);
            box-shadow: inset 0 0 82px rgba(255,255,255,.38), 0 28px 72px rgba(89,84,159,.08);
        }
body { background:linear-gradient(150deg,#faf9fc 8%,#e9e5f5 50%,#f4f0fa 72%,#dfddef); }
    body::before { display:none; }
    body::after { background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.8) 45%,rgba(163,152,207,var(--awake)) 65%,transparent 84%); filter:blur(40px); opacity:.7; }
    .canvas-container { border:0; border-radius:0; box-shadow:none; background:transparent; }
    @media(max-width:1024px) {
      body { height:100svh; }

      .btn-group { width:100%; justify-content:space-around; gap:8px; }

    }
    @media(max-width:767px) {
      body::after { animation:none; filter:blur(16px); opacity:.48; }

      .interaction-caption { top:4.65rem; width:84vw; font-size:.8rem; line-height:1.5; }
      .canvas-container { margin-top:4.1rem; }
      .controls-bar { gap:.2rem; padding:7px 10px; }

    }
  </style>
</head>
<body>

    <div class="play-layer">
    <p class="interaction-caption">화면 위를 천천히 이어 작은 소리와 빛의 흐름을 만들어보세요.</p>
    <div class="canvas-container" id="container">
        <canvas id="universeCanvas"></canvas>
    </div>

    <div class="controls-bar">
        <div class="btn-group">
            <button class="btn" id="playBtn">흐름 듣기</button>
            <button class="btn" id="stopBtn">멈춤</button>
            <button class="btn" id="clearBtn">비우기</button>
        </div>
        
        <div class="tempo-container">
            <span>TEMPO</span>
            <input type="range" id="tempoSlider" class="tempo-slider" min="30" max="150" value="70">
            <span id="tempoValue">70</span>
        </div>
    </div>
    </div>
    <div class="guide-copy" id="guideCopy">
        <p>지쳐 무뎌진 감각을, 작은 빛과 소리로 하나씩 깨워보세요.</p>
        <p class="guide-start"><b>Space</b> 를 누르면 시작됩니다.</p>
    </div>

    <script>
        const canvas = document.getElementById('universeCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('container');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const tempoSlider = document.getElementById('tempoSlider');
        const tempoValue = document.getElementById('tempoValue');
        const guideCopy = document.getElementById('guideCopy');
        let started = false;
        let renderFrame = 0;
        let renderActive = true;

        function beginUniverse() {
            resumeRender();
            if (started) return;
            started = true;
            document.body.classList.add('is-playing');
            guideCopy?.classList.add('is-gone');
        }

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let isDrawing = false;
        let isPlaying = false;
        let scanX = 0;
        let bpm = 70;
        let scanSpeed = (bpm / 60) * 1.8;

        let lines = [];
        let currentLine = null;

        const totalNotes = 8;
        const baseFreqs = [196, 220, 261.63, 293.66, 329.63, 392, 440, 523.25];
        const MAX_LINES = 4;
        const MAX_POINTS_PER_LINE = 64;

        function staffLayout() {
            const w = canvas.width;
            const h = canvas.height;
            const padX = Math.max(16, w * 0.02);
            const padY = Math.max(14, h * 0.05);
            const top = padY;
            const laneH = (h - padY * 2) / totalNotes;
            const colGap = Math.max(32, Math.min(48, w * 0.026));
            const innerW = w - padX * 2;
            const cols = Math.max(16, Math.round(innerW / colGap));
            const startX = padX + (innerW - (cols - 1) * colGap) / 2;
            const rect = canvas.getBoundingClientRect();
            const vmin = Math.min(window.innerWidth, window.innerHeight);
            const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
            const orbSize = Math.min(168 * vmin / 100, 88 * rem);
            return {
                w, h, top, laneH, colGap, cols, startX,
                orbX: window.innerWidth / 2 - rect.left,
                orbY: window.innerHeight / 2 - rect.top,
                orbR: orbSize / 2
            };
        }

        function noteY(row, layout = staffLayout()) {
            return layout.top + (row + 0.5) * layout.laneH;
        }

        function snapToStaff(x, y) {
            const layout = staffLayout();
            let row = Math.floor((y - layout.top) / layout.laneH);
            row = Math.max(0, Math.min(totalNotes - 1, row));
            let col = Math.round((x - layout.startX) / layout.colGap);
            col = Math.max(0, Math.min(layout.cols - 1, col));
            return {
                x: layout.startX + col * layout.colGap,
                y: noteY(row, layout),
                row
            };
        }

        function gridFade(x, y, layout) {
            return Math.max(0, Math.min(1,
                (Math.hypot(x - layout.orbX, y - layout.orbY) - layout.orbR * 0.34) /
                (layout.orbR * 0.5)
            ));
        }

        let audioCtx = null;
        const activeVoices = new Set();
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function pointFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            return snapToStaff(e.clientX - rect.left, e.clientY - rect.top);
        }

        function appendPoint(snapped, withSound = true) {
            if (!currentLine || currentLine.points.length >= MAX_POINTS_PER_LINE) return;
            const lastPoint = currentLine.points[currentLine.points.length - 1];
            if (lastPoint && lastPoint.x === snapped.x && lastPoint.y === snapped.y) return;
            currentLine.points.push({ x: snapped.x, y: snapped.y, played: false });
            if (withSound) triggerMusic(snapped.y, 0.32, 0.022);
        }

        function appendInterpolated(fromEvent, toEvent) {
            const rect = canvas.getBoundingClientRect();
            const x0 = fromEvent.clientX - rect.left;
            const y0 = fromEvent.clientY - rect.top;
            const x1 = toEvent.clientX - rect.left;
            const y1 = toEvent.clientY - rect.top;
            const distance = Math.hypot(x1 - x0, y1 - y0);
            const steps = Math.max(1, Math.ceil(distance / 12));
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                appendPoint(snapToStaff(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t), i === steps);
            }
        }

        let previousPointerEvent = null;

        canvas.addEventListener('pointerdown', (e) => {
            if (!started) return;
            e.preventDefault();
            initAudio();
            const snapped = pointFromEvent(e);
            if (!snapped) return;
            isDrawing = true;
            currentLine = { points: [{ x: snapped.x, y: snapped.y, played: false }] };
            lines.push(currentLine);
            const retained = lines.filter(line => !line.releaseAt);
            if (retained.length > MAX_LINES) retained[0].releaseAt = performance.now() + 2000;
            if (lines.length > 12) lines.shift();
            previousPointerEvent = e;
            canvas.setPointerCapture?.(e.pointerId);
            triggerMusic(snapped.y, 0.38, 0.028);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !currentLine) return;
            e.preventDefault();
            const samples = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
            const events = samples.length ? samples : [e];
            for (const sample of events) {
                appendInterpolated(previousPointerEvent || sample, sample);
                previousPointerEvent = sample;
            }
        });

        function endPointer(e) {
            isDrawing = false; 
            currentLine = null; 
            previousPointerEvent = null;
            if (e) canvas.releasePointerCapture?.(e.pointerId);
        }
        canvas.addEventListener('pointerup', endPointer);
        canvas.addEventListener('pointercancel', endPointer);

        function noteIndexFromY(yPos) {
            const layout = staffLayout();
            const t = (yPos - layout.top) / (layout.laneH * totalNotes);
            const idx = Math.floor((1 - t) * totalNotes);
            return Math.max(0, Math.min(totalNotes - 1, idx));
        }

        function triggerMusic(yPos, duration = 0.9, volume = 0.12) {
            if (!audioCtx) return;

            if (activeVoices.size >= 6) {
                const oldest = activeVoices.values().next().value;
                try { oldest.stop(); } catch (_) {}
                activeVoices.delete(oldest);
            }

            const freq = baseFreqs[noteIndexFromY(yPos)];
            duration = Math.max(1.5, duration);

            const osc = audioCtx.createOscillator();
            const air = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const airGain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            air.type = 'sine';
            air.frequency.setValueAtTime(freq * 4, audioCtx.currentTime);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2400, audioCtx.currentTime);
            filter.Q.setValueAtTime(.35, audioCtx.currentTime);
            
            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(volume * .78, now + 0.008);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            airGain.gain.setValueAtTime(0, now);
            airGain.gain.linearRampToValueAtTime(volume * .25, now + .004);
            airGain.gain.exponentialRampToValueAtTime(.0001, now + .18);
            
            osc.connect(gainNode).connect(filter);
            air.connect(airGain).connect(filter);
            filter.connect(audioCtx.destination);
            
            osc.start(now);
            air.start(now);
            osc.stop(now + duration);
            air.stop(now + duration);
            const voice = { stop() { try { osc.stop(); } catch (_) {} try { air.stop(); } catch (_) {} } };
            activeVoices.add(voice);
            osc.addEventListener('ended', () => activeVoices.delete(voice), { once: true });
        }

        function drawGuide() {
            const layout = staffLayout();
            const { cols, startX, colGap } = layout;

            ctx.save();
            for (let row = 0; row < totalNotes; row++) {
                const y = noteY(row, layout);
                for (let col = 0; col < cols; col++) {
                    const x = startX + col * colGap;
                    const t = gridFade(x, y, layout);
                    const a = 0.2 + t * 0.16;
                    ctx.fillStyle = `rgba(69, 66, 126, ${a})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        function strokeLine(line) {
            ctx.beginPath();
            ctx.moveTo(line.points[0].x, line.points[0].y);
            for (let j = 1; j < line.points.length - 1; j++) {
                const point = line.points[j];
                const next = line.points[j + 1];
                ctx.quadraticCurveTo(point.x, point.y, (point.x + next.x) / 2, (point.y + next.y) / 2);
            }
            const last = line.points[line.points.length - 1];
            if (last) ctx.lineTo(last.x, last.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.96)';
            ctx.shadowColor = 'rgba(76, 71, 145, .32)';
            ctx.shadowBlur = 8;
            ctx.lineWidth = 1.8;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function drawNote(pt) {
            ctx.fillStyle = '#57549f';
            ctx.shadowColor = 'rgba(255,255,255,.72)';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 4.2, 0, Math.PI * 2);
            ctx.fill();
        }

        function render() {
            renderFrame = 0;
            if (!renderActive) return;
            const now = performance.now();
            lines = lines.filter(line => !line.releaseAt || now < line.releaseAt + 650);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const signalCount = lines.reduce((total, line) => total + line.points.length, 0);
            document.body.style.setProperty('--awake', String(Math.min(.48, .14 + signalCount * .0045)));
            drawGuide();

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                ctx.save();
                ctx.globalAlpha = line.releaseAt ? Math.max(0, Math.min(1, (line.releaseAt + 650 - now) / 650)) : 1;
                if (line.points.length > 1) strokeLine(line);

                for (let j = 0; j < line.points.length; j++) {
                    drawNote(line.points[j]);
                }
                ctx.restore();
            }

            if (isPlaying) {
                scanX += scanSpeed;
                if (scanX > canvas.width) {
                    scanX = 0;
                    isPlaying = false;
                    playBtn.classList.remove('active');
                }

                let grad = ctx.createLinearGradient(scanX - 25, 0, scanX + 25, 0);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.18)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.fillStyle = grad;
                ctx.fillRect(scanX - 25, 0, 50, canvas.height);

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];
                    for (let j = 0; j < line.points.length; j++) {
                        let pt = line.points[j];
                        if (!pt.played && Math.abs(pt.x - scanX) <= scanSpeed + 1.5) {
                            pt.played = true;
                            triggerMusic(pt.y, 0.48, 0.055);
                        }
                    }
                }
            }

            renderFrame = requestAnimationFrame(render);
        }

        render();

        function resumeRender() {
            if (renderActive && renderFrame) return;
            renderActive = true;
            renderFrame = requestAnimationFrame(render);
        }

        function startPlay() {
            if (!started) return;
            initAudio();
            if (!isPlaying) {
                scanX = 0;
                lines.forEach(line => line.points.forEach(p => p.played = false));
                isPlaying = true;
                playBtn.classList.add('active');
            }
        }
        window.startPlay = startPlay;

        playBtn.addEventListener('click', startPlay);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                beginUniverse();
                return;
            }
            if (e.key !== 'Enter' || !started) return;
            e.preventDefault();
            startPlay();
        });

        stopBtn.addEventListener('click', () => {
            isPlaying = false;
            scanX = 0;
            playBtn.classList.remove('active');
            lines.forEach(line => line.points.forEach(p => p.played = false));
        });

        clearBtn.addEventListener('click', () => {
            lines = [];
            currentLine = null;
            scanX = 0;
            isPlaying = false;
            playBtn.classList.remove('active');
        });

        tempoSlider.addEventListener('input', (e) => {
            bpm = parseInt(e.target.value);
            tempoValue.textContent = bpm;
            scanSpeed = (bpm / 60) * 1.8;
        });

        window.stopUniverse = function () {
            renderActive = false;
            if (renderFrame) cancelAnimationFrame(renderFrame);
            renderFrame = 0;
            started = false;
            document.body.classList.remove('is-on', 'is-playing');
            guideCopy?.classList.remove('is-gone');
            isPlaying = false;
            scanX = 0;
            isDrawing = false;
            currentLine = null;
            previousPointerEvent = null;
            playBtn.classList.remove('active');
            lines = [];
            document.body.style.setProperty('--awake', '.18');
            bpm = 70;
            tempoSlider.value = 70;
            tempoValue.textContent = 70;
            scanSpeed = (bpm / 60) * 1.8;
            activeVoices.forEach((voice) => { try { voice.stop(); } catch (_) {} });
            activeVoices.clear();
            if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGuide();
        };

        window.startUniverse = function () {
            if (!document.body.classList.contains('is-on')) {
                document.body.classList.add('is-on');
            }
            resize();
            resumeRender();
        };

        window.beginUniverse = beginUniverse;

        window.addEventListener('wheel', (event) => {
            event.preventDefault();
            parent.postMessage({ type: 'card-interact-wheel', deltaY: event.deltaY }, '*');
        }, { passive: false });
    </script>
</body>
</html>
