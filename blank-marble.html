<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>soulspace — BLANK</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./fonts/fonts.css" />
  <style>
    :root {
      color-scheme: light;
      --paper: #efebe4;
      --paper-deep: #e6e0d7;
      --ink: #383633;
      --soft-ink: #77736c;
      --line: rgba(77, 72, 66, .16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #f4f8fb;
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 0;
      width: min(42vmin, 24.5rem);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(10px);
      background: radial-gradient(
        circle at 50% 50%,
        #7cc5e4 0%,
        rgba(124, 197, 228, 0.78) 38%,
        rgba(184, 223, 240, 0.28) 64%,
        transparent 78%
      );
    }

    body.is-on::before {
      animation: orbGrow 2.8s ease-out forwards;
    }

    @keyframes orbGrow {
      0% {
        width: min(42vmin, 24.5rem);
        filter: blur(10px);
      }
      100% {
        width: min(168vmin, 88rem);
        filter: blur(64px);
      }
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.12;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='cardGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23cardGrain)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }

    .blank-space {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      padding: clamp(22px, 5vw, 56px);
      display: flex;
      flex-direction: column;
    }

    header { max-width: 390px; }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--soft-ink);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: -.06em;
    }

    .intro {
      margin: 16px 0 0;
      color: #59554f;
      font-size: 15px;
      line-height: 1.8;
      letter-spacing: -.025em;
    }

    .marble-stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 390px;
      margin-top: 14px;
      touch-action: none;
      user-select: none;
      outline: none;
      cursor: crosshair;
    }

    .marble-stage:focus-visible {
      outline: none;
    }

    .guide-copy {
      position: absolute;
      left: 50%;
      top: 16%;
      z-index: 2;
      width: min(36rem, 88vw);
      margin: 0;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .guide-copy.is-gone {
      opacity: 0;
      transform: translateX(-50%) translateY(-14px);
    }

    .guide-copy p {
      margin: 0;
      color: #2a86bc;
      font-size: clamp(0.92rem, 1.35vw, 1.12rem);
      line-height: 1.85;
      letter-spacing: -0.025em;
      word-break: keep-all;
    }

    .guide-copy p + p {
      margin-top: 0.2rem;
    }

    .guide-start {
      margin-top: 1.35rem !important;
      animation: spacePulse 1.55s ease-in-out infinite;
    }

    .guide-start b {
      font-family: Montserrat, "Helvetica Neue", sans-serif;
      font-weight: 700;
    }

    .play-hint {
      position: absolute;
      left: 50%;
      z-index: 2;
      width: min(36rem, 88vw);
      margin: 0;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      font-size: clamp(0.92rem, 1.35vw, 1.12rem);
      line-height: 1.85;
      letter-spacing: -0.025em;
      word-break: keep-all;
    }

    .play-hint-top {
      top: 11%;
      color: #2a86bc;
    }

    body.is-playing .play-hint {
      opacity: 1;
      transition: opacity 0.65s ease 0.45s;
    }

    @keyframes spacePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      filter: blur(3.5px);
      opacity: 0.72;
      transition: filter 0.9s ease, opacity 0.9s ease;
    }

    body.is-playing canvas {
      filter: blur(0);
      opacity: 1;
      animation: marbleWake 1.15s ease;
    }

    @keyframes marbleWake {
      0% { opacity: 0.72; filter: blur(3.5px); }
      42% { opacity: 1; filter: blur(0); }
      58% { opacity: 0.84; }
      76% { opacity: 1; }
      88% { opacity: 0.92; }
      100% { opacity: 1; filter: blur(0); }
    }

    .hint {
      position: absolute;
      bottom: 7px;
      left: 50%;
      width: min(100%, 410px);
      margin: 0;
      transform: translateX(-50%);
      color: var(--soft-ink);
      font-size: 13px;
      line-height: 1.65;
      text-align: center;
      letter-spacing: -.025em;
      pointer-events: none;
      transition: opacity .6s ease;
    }

    .hint b {
      color: #5b5751;
      font-weight: 400;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-height: 630px) {
      .blank-space { min-height: 100vh; padding-top: 24px; padding-bottom: 20px; }
      .intro { margin-top: 9px; }
      .marble-stage { min-height: 300px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hint { transition: none; }
      .guide-start { animation: none; }
      body.is-playing canvas { animation: none; }
    }

    /* S — 도구 식별성과 긴장/이완의 시각적 대비 */
    body {
      background:
        radial-gradient(ellipse 72% 56% at 50% 58%, rgba(178,221,239,.32), transparent 70%),
        linear-gradient(180deg, #f7fbfd 0%, #edf5f9 100%);
    }

    body::before {
      opacity: .76;
      transition: width 1.1s ease, filter 1.1s ease, opacity 1.1s ease, background 1.1s ease;
    }

    body.is-tense::before {
      width: min(118vmin, 68rem);
      opacity: .88;
      filter: blur(28px) saturate(1.12);
      background: radial-gradient(circle, rgba(73,163,205,.68), rgba(164,216,237,.23) 55%, transparent 78%);
    }

    body.is-centered::before {
      width: min(156vmin, 88rem);
      opacity: .72;
      filter: blur(72px) saturate(.72);
      background: radial-gradient(circle, rgba(203,237,244,.72), rgba(232,247,250,.3) 58%, transparent 82%);
    }

    body.is-tense::after {
      opacity: .32;
      mix-blend-mode: multiply;
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(48,111,143,.14) 78%, rgba(32,80,111,.22) 100%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='cardGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23cardGrain)'/%3E%3C/svg%3E");
    }

    body.is-tense canvas {
      animation: tenseBreath .82s ease-in-out infinite alternate;
      filter: contrast(1.48) saturate(1.18) drop-shadow(0 20px 38px rgba(36,98,132,.26));
    }

    body.is-centered canvas {
      animation: centeredBreath 3.8s ease-in-out infinite alternate;
      filter: contrast(1.18) saturate(.86) drop-shadow(0 14px 34px rgba(71,147,174,.12));
    }

    body.is-tense .marble-stage::before {
      border-color: rgba(55,126,158,.3);
      box-shadow: inset 0 0 82px rgba(69,139,169,.16), 0 28px 70px rgba(46,104,136,.12);
      transform: translate(-50%, -50%) scale(.94);
    }

    body.is-centered .marble-stage::before {
      border-color: rgba(157,211,228,.16);
      box-shadow: inset 0 0 100px rgba(255,255,255,.55), 0 28px 80px rgba(92,164,187,.06);
      transform: translate(-50%, -50%) scale(1.08);
    }

    body.is-tense .play-hint-top { color: #245a78; }
    body.is-centered .play-hint-top { color: #427f94; }

    @keyframes tenseBreath {
      from { transform: translate3d(-1.5px, 0, 0); }
      to { transform: translate3d(1.5px, .8px, 0); }
    }

    @keyframes centeredBreath {
      from { opacity: .94; }
      to { opacity: 1; }
    }

    .marble-stage::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 58%;
      width: min(86vw, 70rem);
      height: min(43vw, 30rem);
      transform: translate(-50%, -50%);
      border: 1px solid rgba(85,146,174,.13);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,255,255,.34), rgba(223,240,247,.08) 54%, transparent 76%);
      box-shadow: inset 0 0 70px rgba(255,255,255,.36), 0 28px 70px rgba(67,127,158,.06);
      pointer-events: none;
      transition: transform 1.2s ease, border-color 1.2s ease, box-shadow 1.2s ease;
    }

    canvas {
      filter: blur(3px) contrast(1.14) saturate(1.04) drop-shadow(0 14px 24px rgba(62,120,148,.08));
    }

    body.is-playing canvas {
      filter: contrast(1.34) saturate(1.08) drop-shadow(0 18px 32px rgba(48,106,137,.18));
    }

    .play-hint-top {
      top: 7%;
      width: auto;
      max-width: min(34rem, 86vw);
      padding: .65rem 1.05rem;
      border: 1px solid rgba(55,122,154,.18);
      border-radius: 999px;
      background: rgba(248,252,253,.68);
      color: #315f79;
      box-shadow: 0 10px 28px rgba(67,126,154,.08), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .guide-copy p { color: #315f79; }

    /* U — 가장자리의 압축과 중앙의 고요를 거리값으로 연결 */
    body {
      --field-x: 0px;
      --field-scale: 1;
      --edge-opacity: .12;
      background:
        radial-gradient(ellipse 34% 28% at 50% 58%, rgba(255,255,255,.82), rgba(222,241,247,.36) 56%, transparent 100%),
        linear-gradient(180deg, #f8fbfd 0%, #edf5f9 100%);
      transition: background 1.2s ease;
    }

    body::before {
      width: min(112vmin, 68rem);
      opacity: .58;
      filter: blur(58px) saturate(.78);
      background: radial-gradient(circle, rgba(178,225,239,.62), rgba(219,241,247,.24) 57%, transparent 79%);
    }

    body::after,
    body.is-tense::after {
      inset: -16%;
      opacity: var(--edge-opacity);
      mix-blend-mode: multiply;
      background:
        repeating-radial-gradient(ellipse at 50% 57%, transparent 0 58px, rgba(58,123,153,.2) 59px 60px, transparent 61px 112px),
        radial-gradient(ellipse at 50% 57%, transparent 34%, rgba(72,140,168,.15) 72%, rgba(42,101,132,.23) 100%);
      background-size: auto;
      transform: translate3d(var(--field-x), 0, 0) scale(var(--field-scale));
      filter: blur(.25px);
      transition: opacity .45s ease, transform .45s ease, filter .45s ease;
    }

    .marble-stage::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 58%;
      z-index: -1;
      width: min(50vw, 37rem);
      aspect-ratio: 1.8;
      transform: translate(-50%, -50%) scale(.76);
      border: 1px solid rgba(139,202,221,.12);
      border-radius: 50%;
      opacity: .28;
      box-shadow: 0 0 0 28px rgba(210,238,245,.04), 0 0 0 68px rgba(210,238,245,.025);
      pointer-events: none;
      transition: opacity 1.2s ease, transform 1.2s ease, box-shadow 1.2s ease;
    }

    body.is-centered .marble-stage::after {
      opacity: .82;
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 0 0 42px rgba(201,235,243,.085), 0 0 0 94px rgba(219,241,247,.055), 0 0 90px rgba(255,255,255,.72);
      animation: quietTide 4.8s ease-in-out infinite alternate;
    }

    body.is-tense::before {
      width: min(92vmin, 56rem);
      opacity: .68;
      filter: blur(38px) saturate(.96);
      background: radial-gradient(circle, rgba(112,188,216,.58), rgba(172,218,235,.18) 55%, transparent 78%);
    }

    body.is-centered::before {
      width: min(172vmin, 98rem);
      opacity: .76;
      filter: blur(82px) saturate(.62);
      background: radial-gradient(circle, rgba(213,241,247,.82), rgba(238,249,251,.4) 60%, transparent 84%);
    }

    body.is-tense canvas,
    body.is-centered canvas {
      animation: none;
    }

    body.is-tense canvas {
      filter: contrast(1.24) saturate(1.04) drop-shadow(0 22px 42px rgba(35,91,121,.2));
    }

    body.is-centered canvas {
      filter: contrast(1.08) saturate(.78) drop-shadow(0 18px 46px rgba(83,157,180,.1));
    }

    @keyframes quietTide {
      from { transform: translate(-50%, -50%) scale(1.02); opacity: .62; }
      to { transform: translate(-50%, -50%) scale(1.12); opacity: .88; }
    }
/* V: 열린 수면의 빛, 장식 원 제거 */
    body { background: linear-gradient(155deg,#f8fcfd 8%,#dceff5 48%,#edf7fa 68%,#d5e9f1 100%); }
    body::before,body.is-tense::before,body.is-centered::before { display:none; }
    body::after,body.is-tense::after { inset:-20%; opacity:.7; background:linear-gradient(165deg,transparent 32%,rgba(255,255,255,.8) 46%,transparent 59%,rgba(111,174,197,.12) 80%); filter:blur(28px); transform:rotate(-8deg); mix-blend-mode:normal; }
    .marble-stage::before,.marble-stage::after,body.is-centered .marble-stage::after { display:none; }
    body.is-playing canvas,body.is-tense canvas,body.is-centered canvas { animation:none; filter:drop-shadow(0 18px 30px rgba(69,124,149,.12)); }
    @media(max-width:1024px) {
      body,.stage { height:100svh; }
      .play-hint-top { top:5rem; width:88vw; font-size:.85rem; }
    }
    @media(max-width:767px) {
      body::after,body.is-tense::after { filter:blur(14px); opacity:.48; }
      .play-hint-top { top:4.65rem; width:84vw; font-size:.8rem; line-height:1.5; }
      .guide-copy { width:84vw; }
    }
  </style>
</head>
<body>
  <main class="blank-space">
    <section class="marble-stage" id="marble-stage" tabindex="0" aria-label="유리구슬을 시소 위에 머물게 하는 공간">
      <canvas id="marble" aria-hidden="true"></canvas>
      <div class="guide-copy" id="guideCopy">
        <p>유리판이 기울면 구슬이 굴러갑니다.</p>
        <p class="guide-start"><b>Space</b> 를 누르면 시작됩니다.</p>
      </div>
      <p class="play-hint play-hint-top" id="playHintTop">마우스나 방향키로 양끝을 기울일 수 있습니다.</p>
      <p class="sr-only" id="hint"></p>
      <p class="sr-only" id="status" aria-live="polite">유리구슬이 천천히 굴러가고 있습니다.</p>
    </section>
  </main>

  <script>
    (() => {
      const stage = document.getElementById('marble-stage');
      const canvas = document.getElementById('marble');
      const hint = document.getElementById('hint');
      const status = document.getElementById('status');
      const guideCopy = document.getElementById('guideCopy');
      const playHintTop = document.getElementById('playHintTop');
      const context = canvas.getContext('2d');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const marbleAsset = new Image();
      let marbleSprite = null;
      let marbleAssetLoaded = false;
      let visualState = 'neutral';

      if (window.matchMedia('(max-width: 767px)').matches) {
        playHintTop.textContent = '손가락을 좌우로 움직여 양끝의 기울기를 조절해보세요.';
        const startLine = guideCopy?.querySelector('.guide-start');
        if (startLine) startLine.textContent = '화면을 터치하면 시작됩니다.';
      }

      function setVisualState(next) {
        if (visualState === next) return;
        visualState = next;
        if (next === 'tense') {
          playHintTop.textContent = '흔들림을 따라가지 말고, 반대편을 천천히 눌러보세요.';
        } else if (next === 'centered') {
          playHintTop.textContent = '잠시, 가운데에 머물러 보세요.';
        } else {
          playHintTop.textContent = '양끝을 누르거나 방향키로 천천히 기울여 보세요.';
        }
      }
      marbleAsset.addEventListener('load', () => {
        marbleSprite = marbleAsset;
        marbleAssetLoaded = true;
        if (typeof draw === 'function') draw();
      });
      marbleAsset.src = 'blank-glass-sphere.png?v=3';

      let width = 0;
      let height = 0;
      let scale = 1;
      let beam = { x: 0, y: 0, half: 0, thickness: 0, panelHeight: 0, marble: 0, angle: 0, target: 0, restZ: 0 };
      let marble = { place: 0, velocity: 0, falling: 0, direction: 1, spin: 0 };
      let press = { active: false, x: 0, place: 0, strength: 0 };
      let lastTime = performance.now();
      let animationFrame = 0;
      let animationActive = false;
      let centeredFor = 0;
      let lastStatus = '';
      let started = false;
      let lift = 0;
      let nudgeDone = false;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      function resize() {
        const bounds = stage.getBoundingClientRect();
        scale = Math.min(window.devicePixelRatio || 1, window.innerWidth <= 767 ? 1.25 : 2);
        width = Math.max(1, bounds.width);
        height = Math.max(1, bounds.height);
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        context.setTransform(scale, 0, 0, scale, 0, 0);

        beam.half = Math.min(width * .43, 460, height * .48);
        beam.thickness = clamp(width * .02, 13, 20);
        beam.panelHeight = beam.half * 1.22;
        beam.marble = clamp(width * .068, 22, 58);
        beam.x = width / 2;
        beam.y = height * (0.78 - 0.27 * lift);
        marble.place = clamp(marble.place, -beam.half + beam.marble, beam.half - beam.marble);
        draw(performance.now());
      }

      function pointFromEvent(event) {
        const rect = stage.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      function updatePress(event) {
        const point = pointFromEvent(event);
        press.x = point.x;
        press.place = clamp(point.x - beam.x, -beam.half * .9, beam.half * .9);
        press.strength = clamp(Math.abs(press.place) / (beam.half * .55), .32, 1);
      }

      function setStatus(text) {
        if (lastStatus === text) return;
        lastStatus = text;
        status.textContent = text;
      }

      function begin(event) {
        if (!started) return;
        event.preventDefault();
        stage.focus({ preventScroll: true });
        press.active = true;
        updatePress(event);
        stage.setPointerCapture?.(event.pointerId);
        hint.style.opacity = '.34';
      }

      function move(event) {
        if (press.active) updatePress(event);
      }

      function end(event) {
        if (!press.active) return;
        press.active = false;
        press.strength = 0;
        stage.releasePointerCapture?.(event.pointerId);
      }

      stage.addEventListener('pointerdown', begin);
      stage.addEventListener('pointermove', move);
      stage.addEventListener('pointerup', end);
      stage.addEventListener('pointercancel', end);

      function beginPlay() {
        resumeAnimation();
        if (started) return;
        started = true;
        document.body.classList.add('is-playing');
        guideCopy.classList.add('is-gone');
        stage.focus({ preventScroll: true });
      }

      stage.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.key === ' ') {
          event.preventDefault();
          beginPlay();
          return;
        }
        if (!started) return;
        if (event.key === 'r' || event.key === 'R') {
          marble.place = 0;
          marble.velocity = 0;
          marble.falling = 0;
          marble.spin = 0;
          beam.angle = 0;
          hint.innerHTML = '<b>가까이 갈수록, 천천히.</b><br>구슬 반대편의 막대를 눌러 보세요.';
          hint.style.opacity = '1';
          event.preventDefault();
          return;
        }
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
        event.preventDefault();
        press.x = beam.x + (event.key === 'ArrowLeft' || event.key === 'ArrowUp' ? -beam.half * .74 : beam.half * .74);
        press.place = press.x - beam.x;
        press.strength = .86;
        press.active = true;
        window.clearTimeout(stage.keyRelease);
        stage.keyRelease = window.setTimeout(() => { press.active = false; }, 240);
      });

      function pointOnBeam(place, above = 0) {
        const ang = beam.angle + beam.restZ;
        return {
          x: beam.x + place * Math.cos(ang) - above * Math.sin(ang),
          y: beam.y + place * Math.sin(ang) - above * Math.cos(ang)
        };
      }

      function drawGround() {
        context.save();
        context.filter = 'blur(14px)';
        context.translate(beam.x, beam.y + beam.half * .08);
        context.scale(0.82, 0.22);
        const glow = context.createRadialGradient(0, 0, 0, 0, 0, beam.half * 0.62);
        glow.addColorStop(0, 'rgba(255, 255, 255, .22)');
        glow.addColorStop(.45, 'rgba(184, 223, 240, .08)');
        glow.addColorStop(1, 'rgba(124, 197, 228, 0)');
        context.fillStyle = glow;
        context.beginPath();
        context.arc(0, 0, beam.half * 0.62, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawGlassSupport() {
        const slabHeight = beam.half * .5;
        const sideW = clamp(beam.thickness * .32, 5, 10);

        context.save();
        context.translate(beam.x, beam.y + beam.thickness * .2);
        context.shadowColor = 'rgba(72, 91, 99, .1)';
        context.shadowBlur = beam.thickness * 1.1;
        context.shadowOffsetY = beam.thickness * .48;
        context.fillStyle = 'rgba(106, 126, 134, .1)';
        context.beginPath();
        context.ellipse(0, slabHeight + sideW * .35, sideW * .45, sideW * .22, 0, 0, Math.PI * 2);
        context.fill();
        context.shadowColor = 'transparent';

        const x0 = -sideW / 2;
        const glass = context.createLinearGradient(x0, 0, x0 + sideW, slabHeight);
        glass.addColorStop(0, 'rgba(255, 255, 255, .62)');
        glass.addColorStop(.45, 'rgba(210, 232, 240, .28)');
        glass.addColorStop(1, 'rgba(148, 186, 198, .38)');
        context.fillStyle = glass;
        context.beginPath();
        context.moveTo(x0, 0);
        context.lineTo(x0 + sideW, 0);
        context.lineTo(x0 + sideW, slabHeight);
        context.lineTo(x0, slabHeight);
        context.closePath();
        context.fill();

        context.strokeStyle = 'rgba(255, 255, 255, .78)';
        context.lineWidth = 1;
        context.stroke();
        context.strokeStyle = 'rgba(110, 154, 172, .32)';
        context.lineWidth = .7;
        context.stroke();

        context.strokeStyle = 'rgba(255, 255, 255, .9)';
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(x0 + .8, 1);
        context.lineTo(x0 + .8, slabHeight - 1);
        context.stroke();
        context.restore();
      }

      function drawBeam() {
        const pitch = Math.PI * .47;
        const depth = Math.cos(pitch);
        const farScale = .7;
        const projectedHeight = beam.panelHeight * depth;
        const farWidth = beam.half * 2 * farScale;
        const nearWidth = beam.half * 2;
        const topY = -projectedHeight / 2;
        const bottomY = projectedHeight / 2;
        const plateDepth = clamp(beam.thickness * .72, 10, 16);

        const panelPath = () => {
          context.beginPath();
          context.moveTo(-farWidth / 2, topY);
          context.lineTo(farWidth / 2, topY);
          context.lineTo(nearWidth / 2, bottomY);
          context.lineTo(-nearWidth / 2, bottomY);
          context.closePath();
        };

        context.save();
        context.translate(beam.x, beam.y);
        context.rotate(beam.angle + beam.restZ);

        const glassBody = () => {
          context.beginPath();
          context.moveTo(-farWidth / 2, topY);
          context.lineTo(farWidth / 2, topY);
          context.lineTo(nearWidth / 2, bottomY);
          context.lineTo(nearWidth / 2, bottomY + plateDepth);
          context.lineTo(-nearWidth / 2, bottomY + plateDepth);
          context.lineTo(-nearWidth / 2, bottomY);
          context.closePath();
        };

        const glass = context.createLinearGradient(0, topY, 0, bottomY + plateDepth);
        glass.addColorStop(0, 'rgba(255, 255, 255, .42)');
        glass.addColorStop(.2, 'rgba(210, 232, 240, .28)');
        glass.addColorStop(.52, 'rgba(176, 216, 228, .2)');
        glass.addColorStop(.78, 'rgba(148, 196, 214, .26)');
        glass.addColorStop(1, 'rgba(132, 176, 192, .28)');
        context.fillStyle = glass;
        glassBody();
        context.fill();

        context.save();
        panelPath();
        context.clip();
        const sheen = context.createLinearGradient(-nearWidth / 2, topY, nearWidth / 2, bottomY);
        sheen.addColorStop(0, 'rgba(255, 255, 255, .28)');
        sheen.addColorStop(.45, 'rgba(255, 255, 255, 0)');
        sheen.addColorStop(1, 'rgba(255, 255, 255, .12)');
        context.fillStyle = sheen;
        panelPath();
        context.fill();
        context.restore();

        if (!marble.falling) {
          context.save();
          panelPath();
          context.clip();
          const reflectionY = projectedHeight * .18;
          const reflectionSize = beam.marble * .9;
          const reflectionGlow = context.createRadialGradient(
            marble.place, reflectionY, 0,
            marble.place, reflectionY, reflectionSize * 1.8
          );
          reflectionGlow.addColorStop(0, 'rgba(255, 255, 255, .32)');
          reflectionGlow.addColorStop(.5, 'rgba(176, 216, 228, .12)');
          reflectionGlow.addColorStop(1, 'rgba(176, 216, 228, 0)');
          context.fillStyle = reflectionGlow;
          context.beginPath();
          context.ellipse(marble.place, reflectionY, reflectionSize * 1.5, reflectionSize * .38, 0, 0, Math.PI * 2);
          context.fill();
          if (marbleAssetLoaded && marbleSprite) {
            context.globalAlpha = .22;
            context.translate(marble.place, reflectionY + reflectionSize * .12);
            context.scale(1, -.36);
            context.beginPath();
            context.arc(0, 0, reflectionSize, 0, Math.PI * 2);
            context.clip();
            context.drawImage(marbleSprite, -reflectionSize, -reflectionSize, reflectionSize * 2, reflectionSize * 2);
          }
          context.restore();
        }

        context.lineJoin = 'round';
        context.strokeStyle = 'rgba(255, 255, 255, .55)';
        context.lineWidth = 1.1;
        context.beginPath();
        context.moveTo(-nearWidth / 2, bottomY);
        context.lineTo(-farWidth / 2, topY);
        context.lineTo(farWidth / 2, topY);
        context.lineTo(nearWidth / 2, bottomY);
        context.stroke();
        context.strokeStyle = 'rgba(110, 154, 172, .22)';
        context.lineWidth = .7;
        context.beginPath();
        context.moveTo(-nearWidth / 2, bottomY);
        context.lineTo(-farWidth / 2, topY);
        context.lineTo(farWidth / 2, topY);
        context.lineTo(nearWidth / 2, bottomY);
        context.stroke();

        context.strokeStyle = 'rgba(255, 255, 255, .85)';
        context.lineWidth = 1.1;
        context.beginPath();
        context.moveTo(-farWidth / 2, topY);
        context.lineTo(farWidth / 2, topY);
        context.stroke();
        context.restore();
      }

      function drawPress() {
        if (!press.active) return;
        const point = pointOnBeam(press.place, beam.thickness * .1);
        const pulse = 1 + Math.sin(performance.now() * .004) * .04;
        const radius = beam.marble * (1.3 + press.strength * .25) * pulse;
        const ring = context.createRadialGradient(point.x, point.y, 0, point.x, point.y, radius * 1.7);
        ring.addColorStop(0, 'rgba(75, 104, 114, .12)');
        ring.addColorStop(.58, 'rgba(92, 113, 121, .042)');
        ring.addColorStop(1, 'rgba(92, 113, 121, 0)');
        context.fillStyle = ring;
        context.beginPath();
        context.arc(point.x, point.y, radius * 1.7, 0, Math.PI * 2);
        context.fill();
      }

      function drawMarble() {
        const point = pointOnBeam(marble.place, beam.thickness * .56 + beam.marble);
        const fall = marble.falling;
        const opacity = fall ? Math.max(0, 1 - fall) : 1;
        const size = beam.marble * (fall ? 1 - fall * .55 : 1);
        const fallX = fall * marble.direction * beam.marble * 2.2;
        const fallY = fall * fall * beam.marble * 8.5;
        if (opacity <= 0 || size <= 1) return;

        context.save();
        context.globalAlpha = opacity;
        context.translate(point.x + fallX, point.y + fallY);
        context.rotate(marble.spin);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        if (marbleAssetLoaded && marbleSprite) {
          context.beginPath();
          context.arc(0, 0, size, 0, Math.PI * 2);
          context.clip();
          context.drawImage(marbleSprite, 0, 0, marbleSprite.width, marbleSprite.height, -size, -size, size * 2, size * 2);
        } else {
          const glass = context.createRadialGradient(-size * .28, -size * .32, size * .04, 0, size * .12, size);
          glass.addColorStop(0, 'rgba(255, 255, 255, .95)');
          glass.addColorStop(.2, 'rgba(255, 255, 255, .55)');
          glass.addColorStop(.55, 'rgba(187, 224, 241, .22)');
          glass.addColorStop(.82, 'rgba(142, 203, 231, .28)');
          glass.addColorStop(1, 'rgba(187, 224, 241, .42)');
          context.fillStyle = glass;
          context.beginPath();
          context.arc(0, 0, size, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = 'rgba(255, 255, 255, .78)';
          context.beginPath();
          context.ellipse(-size * .26, -size * .3, size * .2, size * .12, -0.45, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = 'rgba(255, 255, 255, .7)';
          context.beginPath();
          context.arc(-size * .08, size * .18, size * .07, 0, Math.PI * 2);
          context.fill();
          context.beginPath();
          context.arc(size * .12, size * .28, size * .045, 0, Math.PI * 2);
          context.fill();
        }
        context.restore();
      }

      function draw() {
        context.clearRect(0, 0, width, height);
        const distance = Math.abs(marble.place) / Math.max(beam.half, 1);
        const tension = Math.max(0, Math.min(1, (distance - .12) / .58));
        const motion = reducedMotion ? 0 : Math.pow(tension, 1.2);
        const time = performance.now() * .001;
        context.save();
        context.translate(width / 2, height / 2);
        context.rotate(Math.sin(time * 9) * motion * .009);
        context.translate(-width / 2 + Math.sin(time * 12) * motion * 5, -height / 2 + Math.sin(time * 8.3) * motion * 2);
        drawGround();
        drawGlassSupport();
        drawBeam();
        drawPress();
        drawMarble();
        context.restore();
      }

      function respawn() {
        marble.place = (Math.random() - .5) * beam.marble;
        marble.velocity = (Math.random() - .5) * .08;
        marble.falling = 0;
        marble.spin = (Math.random() - .5) * .16;
        hint.textContent = '그래도, 다시 굴러옵니다.';
        hint.style.opacity = '.8';
        setStatus('구슬이 다시 막대 가운데로 돌아왔습니다.');
      }

      function animate(now) {
        animationFrame = 0;
        if (!animationActive) return;
        const elapsed = Math.min(32, now - lastTime);
        lastTime = now;
        const frame = elapsed / 16.67;

        if (started && lift < 1) {
          lift = Math.min(1, lift + elapsed / 780);
          beam.y = height * (0.78 - 0.27 * lift);
          draw();
          animationFrame = requestAnimationFrame(animate);
          return;
        }

        if (started && !nudgeDone) {
          nudgeDone = true;
          marble.place = (Math.random() - .5) * beam.marble * .45;
          marble.velocity = (Math.random() < .5 ? -1 : 1) * (0.18 + Math.random() * .1);
        }

        if (!started) {
          marble.place = 0;
          marble.velocity = 0;
          marble.falling = 0;
          beam.angle = 0;
          beam.target = 0;
          press.active = false;
          draw();
          animationFrame = requestAnimationFrame(animate);
          return;
        }

        if (!marble.falling) {
          const edgeWeight = Math.max(0, Math.min(1, (Math.abs(marble.place) / beam.half - .16) / .7));
          const drift = reducedMotion ? 0 : (Math.sin(now * .0011) * .085 + Math.sin(now * .00047 + 1.1) * .04) * edgeWeight;
          beam.target = press.active ? (press.place / beam.half) * .34 * press.strength : drift;
          beam.angle += (beam.target - beam.angle) * .12 * frame;
          marble.velocity += Math.sin(beam.angle) * .078 * frame;
          marble.velocity += Math.sign(marble.place || marble.velocity || 1) *
            Math.pow(Math.abs(marble.place) / beam.half, 1.35) * .018 * frame;
          marble.velocity *= Math.pow(edgeWeight === 0 && !press.active ? .88 : .993, frame);
          marble.place += marble.velocity * frame;
          marble.spin += marble.velocity * frame / (beam.marble * .78);

          const limit = beam.half - beam.marble * .88;
          if (Math.abs(marble.place) > limit) {
            marble.place = Math.sign(marble.place) * limit;
            marble.direction = Math.sign(marble.place);
            marble.falling = .01;
            hint.textContent = '가장자리를 넘었습니다.';
            hint.style.opacity = '.72';
            setStatus('구슬이 시소 끝을 넘어갔습니다. 잠시 후 다시 돌아옵니다.');
          } else if (Math.abs(marble.place) < beam.marble * .8) {
            centeredFor += elapsed;
            if (centeredFor > 2300) {
              hint.textContent = '잠시, 가운데에.';
              hint.style.opacity = '.9';
              setStatus('구슬이 잠시 가운데에 머물고 있습니다.');
            }
          } else {
            centeredFor = 0;
            if (Math.abs(marble.place) > beam.half * .72 && !press.active) {
              setStatus('구슬이 시소 끝 가까이 굴러가고 있습니다.');
            }
          }

          const distance = Math.abs(marble.place) / Math.max(beam.half, 1);
          const side = marble.place / Math.max(beam.half, 1);
          document.body.style.setProperty('--field-x', `${side * -34}px`);
          document.body.style.setProperty('--field-scale', String(1 + distance * .065));
          document.body.style.setProperty('--edge-opacity', String(.08 + distance * .44));
          document.body.classList.toggle('is-tense', distance > .62);
          document.body.classList.toggle('is-centered', distance < .13 && centeredFor > 900);
          setVisualState(distance > .62 ? 'tense' : (distance < .13 && centeredFor > 900 ? 'centered' : 'neutral'));
        } else {
          document.body.classList.add('is-tense');
          document.body.classList.remove('is-centered');
          setVisualState('tense');
          marble.falling += elapsed / 850;
          if (marble.falling >= 1) respawn();
        }

        draw();
        animationFrame = requestAnimationFrame(animate);
      }

      function resumeAnimation() {
        if (animationActive && animationFrame) return;
        animationActive = true;
        lastTime = performance.now();
        animationFrame = requestAnimationFrame(animate);
      }

      window.addEventListener('wheel', (event) => {
        event.preventDefault();
        parent.postMessage({ type: 'blank-marble-wheel', deltaY: event.deltaY }, '*');
      }, { passive: false });

      new ResizeObserver(resize).observe(stage);
      resize();
      window.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.key === ' ') {
          event.preventDefault();
          beginPlay();
        }
      });

      window.startMarble = function () {
        if (!document.body.classList.contains('is-on')) {
          document.body.classList.add('is-on');
        }
        resize();
      };
      window.beginMarble = function () {
        beginPlay();
      };
      window.resetMarble = function () {
        animationActive = false;
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = 0;
        started = false;
        lift = 0;
        nudgeDone = false;
        marble.place = 0;
        marble.velocity = 0;
        marble.falling = 0;
        marble.spin = 0;
        beam.angle = 0;
        beam.target = 0;
        press.active = false;
        document.body.classList.remove('is-playing');
        document.body.classList.remove('is-tense', 'is-centered');
        document.body.style.setProperty('--field-x', '0px');
        document.body.style.setProperty('--field-scale', '1');
        document.body.style.setProperty('--edge-opacity', '.12');
        centeredFor = 0;
        setVisualState('neutral');
        guideCopy.classList.remove('is-gone');
        resize();
        draw();
      };
    })();
  </script>
</body>
</html>
