<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>soulspace — BLANK</title>
  <link rel="stylesheet" href="./fonts/fonts.css" />
  <style>
      :root {
        --font-en: "Butler Stencil", "Noto Serif KR", Georgia, serif;
        --font-ko: "Noto Serif KR", "Butler Stencil", Georgia, serif;
      }

    :root {
      color-scheme: light;
      --paper: #efebe4;
      --paper-deep: #e6e0d7;
      --ink: #383633;
      --soft-ink: #77736c;
      --line: rgba(77, 72, 66, .16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #f4f8fb;
      color: var(--ink);
      font-family: var(--font-ko);
    }

    body::before {
      content: "";
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 0;
      width: min(168vmin, 88rem);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.25);
      pointer-events: none;
      will-change: transform;
      background: radial-gradient(
        circle at 50% 50%,
        #7cc5e4 0%,
        rgba(124, 197, 228, 0.72) 30%,
        rgba(184, 223, 240, 0.3) 55%,
        rgba(184, 223, 240, 0.1) 68%,
        transparent 74%
      );
    }

    body.is-on::before {
      animation: orbGrow 2.8s ease-out forwards;
    }

    @keyframes orbGrow {
      0% {
        transform: translate(-50%, -50%) scale(0.25);
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.12;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='cardGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23cardGrain)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }

    .blank-space {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      padding: clamp(22px, 5vw, 56px);
      display: flex;
      flex-direction: column;
    }

    header { max-width: 390px; }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--soft-ink);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: -.06em;
    }

    .intro {
      margin: 16px 0 0;
      color: #59554f;
      font-size: 15px;
      line-height: 1.8;
      letter-spacing: -.025em;
    }

    .marble-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      touch-action: none;
      user-select: none;
      outline: none;
      cursor: crosshair;
    }

    .marble-stage:focus-visible {
      outline: none;
    }

    .guide-copy {
      position: absolute;
      left: 50%;
      top: 16%;
      z-index: 2;
      width: min(36rem, 88vw);
      margin: 0;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .guide-copy.is-gone {
      opacity: 0;
      transform: translateX(-50%) translateY(-14px);
    }

    .guide-copy p {
      margin: 0;
      color: #2a86bc;
      font-size: clamp(0.92rem, 1.35vw, 1.12rem);
      line-height: 1.85;
      letter-spacing: -0.025em;
      word-break: keep-all;
    }

    .guide-copy p + p {
      margin-top: 0.2rem;
    }

    .guide-start {
      margin-top: 1.35rem !important;
      animation: spacePulse 1.55s ease-in-out infinite;
    }

    .guide-start b {
      font-family: var(--font-en);
      font-weight: 700;
    }

    .play-hint {
      position: absolute;
      left: 50%;
      z-index: 2;
      width: min(36rem, 88vw);
      margin: 0;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      font-size: clamp(0.92rem, 1.35vw, 1.12rem);
      line-height: 1.85;
      letter-spacing: -0.025em;
      word-break: keep-all;
    }

    .play-hint-top {
      top: 11%;
      color: #2a86bc;
    }

    body.is-playing .play-hint {
      opacity: 1;
      transition: opacity 0.65s ease 0.45s;
    }

    @keyframes spacePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0.72;
      transition: opacity 0.9s ease;
    }

    body.is-playing canvas {
      opacity: 1;
    }


    .hint {
      position: absolute;
      bottom: 7px;
      left: 50%;
      width: min(100%, 410px);
      margin: 0;
      transform: translateX(-50%);
      color: var(--soft-ink);
      font-size: 13px;
      line-height: 1.65;
      text-align: center;
      letter-spacing: -.025em;
      pointer-events: none;
      transition: opacity .6s ease;
    }

    .hint b {
      color: #5b5751;
      font-weight: 400;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-height: 630px) {
      .blank-space { min-height: 100vh; padding-top: 24px; padding-bottom: 20px; }
      .intro { margin-top: 9px; }
      .marble-stage { min-height: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hint { transition: none; }
      .guide-start { animation: none; }
      body.is-playing canvas { animation: none; }
    }

        .key-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.2em;
            height: 1.55em;
            margin: 0 0.2em;
            padding: 0 0.45em;
            border: 1.5px solid currentColor;
            border-radius: 0.4em;
            font-family: var(--font-en);
            font-weight: 500;
            line-height: 1;
        }

        .key-icon.is-space {
            min-width: 3.4em;
            padding-top: 0.15em;
        }

        .guide-copy {
            width: max-content !important;
            max-width: 96vw;
            text-align: center !important;
        }

        .guide-copy {
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
        }

        .guide-copy.is-gone {
            transform: translate(-50%, calc(-50% - 14px)) !important;
        }

        .key-icon {
            vertical-align: middle;
            position: relative;
            top: -0.1em;
        }
    body { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
</style>
    <link rel="stylesheet" href="./fonts/butler-stencil/butler-stencil.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" />
</head>
<body>
  <main class="blank-space">
    <section class="marble-stage" id="marble-stage" tabindex="0" aria-label="유리구슬을 시소 위에 머물게 하는 공간">
      <canvas id="marble" aria-hidden="true"></canvas>
      <div class="guide-copy" id="guideCopy">
        <p>유리판이 기울면 구슬이 굴러갑니다.</p>
      </div>
      <p class="play-hint play-hint-top" id="playHintTop">마우스나 방향키로 양끝을 기울일 수 있습니다.</p>
      <p class="sr-only" id="hint"></p>
      <p class="sr-only" id="status" aria-live="polite">유리구슬이 천천히 굴러가고 있습니다.</p>
    </section>
  </main>

  <script>
    (() => {
      const stage = document.getElementById('marble-stage');
      const canvas = document.getElementById('marble');
      const hint = document.getElementById('hint');
      const status = document.getElementById('status');
      const guideCopy = document.getElementById('guideCopy');
      const context = canvas.getContext('2d');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const marbleAsset = new Image();
      let marbleSprite = null;
      let marbleAssetLoaded = false;
      marbleAsset.addEventListener('load', () => {
        marbleSprite = marbleAsset;
        marbleAssetLoaded = true;
        if (typeof draw === 'function') draw();
      });
      marbleAsset.src = 'blank-glass-sphere.png?v=3';

      let width = 0;
      let height = 0;
      let scale = 1;
      let beam = { x: 0, y: 0, half: 0, thickness: 0, panelHeight: 0, marble: 0, angle: 0, target: 0, restZ: 0 };
      let marble = { place: 0, velocity: 0, falling: 0, direction: 1, spin: 0 };
      let press = { active: false, x: 0, place: 0, strength: 0 };
      let lastTime = performance.now();
      let centeredFor = 0;
      let lastStatus = '';
      let started = false;
      let lift = 1;
      let nudgeDone = false;
      const drop = { active: false, y: 0, vy: 0, bounces: 0 };

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      function resize() {
        const bounds = stage.getBoundingClientRect();
        scale = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(1, bounds.width);
        height = Math.max(1, bounds.height);
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        context.setTransform(scale, 0, 0, scale, 0, 0);

        beam.half = Math.min(width * .29, 300, height * .34);
        beam.thickness = clamp(width * .02, 13, 20);
        beam.panelHeight = beam.half * 1.22;
        beam.marble = clamp(width * .068, 40, 58);
        beam.x = width / 2;
        beam.y = height * (0.78 - 0.27 * lift);
        marble.place = clamp(marble.place, -beam.half + beam.marble, beam.half - beam.marble);
        draw(performance.now());
      }

      function pointFromEvent(event) {
        const rect = stage.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      function updatePress(event) {
        const point = pointFromEvent(event);
        press.x = point.x;
        press.place = clamp(point.x - beam.x, -beam.half * .9, beam.half * .9);
        press.strength = clamp(Math.abs(press.place) / (beam.half * .55), .32, 1);
      }

      function setStatus(text) {
        if (lastStatus === text) return;
        lastStatus = text;
        status.textContent = text;
      }

      function begin(event) {
        if (!started) return;
        event.preventDefault();
        stage.focus({ preventScroll: true });
        press.active = true;
        updatePress(event);
        stage.setPointerCapture?.(event.pointerId);
        hint.style.opacity = '.34';
      }

      function move(event) {
        if (press.active) updatePress(event);
      }

      function end(event) {
        if (!press.active) return;
        press.active = false;
        press.strength = 0;
        stage.releasePointerCapture?.(event.pointerId);
      }

      stage.addEventListener('pointerdown', begin);
      stage.addEventListener('pointermove', move);
      stage.addEventListener('pointerup', end);
      stage.addEventListener('pointercancel', end);

      function beginPlay() {
        if (started || drop.active) return;
        if (window.dropMarble) {
          window.dropMarble();
          return;
        }
        started = true;
        document.body.classList.add('is-playing');
        guideCopy.classList.add('is-gone');
        stage.focus({ preventScroll: true });
      }

      stage.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.key === ' ') {
          event.preventDefault();
          beginPlay();
          return;
        }
        if (!started) return;
        if (event.key === 'r' || event.key === 'R') {
          marble.place = 0;
          marble.velocity = 0;
          marble.falling = 0;
          marble.spin = 0;
          beam.angle = 0;
          hint.innerHTML = '<b>가까이 갈수록, 천천히.</b><br>구슬 반대편의 막대를 눌러 보세요.';
          hint.style.opacity = '1';
          event.preventDefault();
          return;
        }
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
        event.preventDefault();
        press.x = beam.x + (event.key === 'ArrowLeft' || event.key === 'ArrowUp' ? -beam.half * .74 : beam.half * .74);
        press.place = press.x - beam.x;
        press.strength = .86;
        press.active = true;
        window.clearTimeout(stage.keyRelease);
        stage.keyRelease = window.setTimeout(() => { press.active = false; }, 240);
      });

      function pointOnBeam(place, above = 0) {
        const ang = beam.angle + beam.restZ;
        return {
          x: beam.x + place * Math.cos(ang) - above * Math.sin(ang),
          y: beam.y + place * Math.sin(ang) - above * Math.cos(ang)
        };
      }

      function drawGround() {
        context.save();
        context.filter = 'blur(14px)';
        context.translate(beam.x, beam.y + beam.half * .08);
        context.scale(0.82, 0.22);
        const glow = context.createRadialGradient(0, 0, 0, 0, 0, beam.half * 0.62);
        glow.addColorStop(0, 'rgba(255, 255, 255, .22)');
        glow.addColorStop(.45, 'rgba(184, 223, 240, .08)');
        glow.addColorStop(1, 'rgba(124, 197, 228, 0)');
        context.fillStyle = glow;
        context.beginPath();
        context.arc(0, 0, beam.half * 0.62, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawGlassSupport() {
        const slabHeight = beam.half * .5;
        const sideW = clamp(beam.thickness * .32, 5, 10);

        context.save();
        context.translate(beam.x, beam.y + beam.thickness * .2);
        context.shadowColor = 'rgba(72, 91, 99, .1)';
        context.shadowBlur = beam.thickness * 1.1;
        context.shadowOffsetY = beam.thickness * .48;
        context.fillStyle = 'rgba(106, 126, 134, .1)';
        context.beginPath();
        context.ellipse(0, slabHeight + sideW * .35, sideW * .45, sideW * .22, 0, 0, Math.PI * 2);
        context.fill();
        context.shadowColor = 'transparent';

        const x0 = -sideW / 2;
        const glass = context.createLinearGradient(x0, 0, x0 + sideW, slabHeight);
        glass.addColorStop(0, 'rgba(255, 255, 255, .62)');
        glass.addColorStop(.45, 'rgba(186, 222, 238, .14)');
        glass.addColorStop(1, 'rgba(148, 186, 198, .38)');
        context.fillStyle = glass;
        context.beginPath();
        context.moveTo(x0, 0);
        context.lineTo(x0 + sideW, 0);
        context.lineTo(x0 + sideW, slabHeight);
        context.lineTo(x0, slabHeight);
        context.closePath();
        context.fill();

        context.strokeStyle = 'rgba(255, 255, 255, .78)';
        context.lineWidth = 1;
        context.stroke();
        context.strokeStyle = 'rgba(110, 154, 172, .32)';
        context.lineWidth = .7;
        context.stroke();

        context.strokeStyle = 'rgba(255, 255, 255, .9)';
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(x0 + .8, 1);
        context.lineTo(x0 + .8, slabHeight - 1);
        context.stroke();
        context.restore();
      }

      function drawBeam() {
        const pitch = Math.PI * .435;
        const depth = Math.cos(pitch);
        const farScale = .94;
        const projectedHeight = beam.panelHeight * depth;
        const farWidth = beam.half * 2 * farScale;
        const nearWidth = beam.half * 2;
        const topY = -projectedHeight / 2;
        const bottomY = projectedHeight / 2;
        const plateDepth = clamp(beam.thickness * .22, 3, 5);

        const panelPath = () => {
          context.beginPath();
          context.moveTo(-farWidth / 2, topY);
          context.lineTo(farWidth / 2, topY);
          context.lineTo(nearWidth / 2, bottomY);
          context.lineTo(-nearWidth / 2, bottomY);
          context.closePath();
        };

        context.save();
        context.translate(beam.x, beam.y);
        context.rotate(beam.angle + beam.restZ);

        const glassBody = () => {
          context.beginPath();
          context.moveTo(-farWidth / 2, topY);
          context.lineTo(farWidth / 2, topY);
          context.lineTo(nearWidth / 2, bottomY);
          context.lineTo(nearWidth / 2, bottomY + plateDepth);
          context.lineTo(-nearWidth / 2, bottomY + plateDepth);
          context.lineTo(-nearWidth / 2, bottomY);
          context.closePath();
        };

        const glass = context.createLinearGradient(0, topY, 0, bottomY + plateDepth);
        glass.addColorStop(0, 'rgba(255, 255, 255, .17)');
        glass.addColorStop(.2, 'rgba(186, 222, 238, .14)');
        glass.addColorStop(.52, 'rgba(164, 210, 231, .10)');
        glass.addColorStop(.78, 'rgba(168, 215, 234, .15)');
        glass.addColorStop(1, 'rgba(132, 185, 211, .23)');
        context.fillStyle = glass;
        glassBody();
        context.fill();

        context.save();
        panelPath();
        context.clip();
        // 배경의 빛을 판의 기울기에 맞춰 압축해 굴절을 표현한다.
        const bend = Math.sin(beam.angle + beam.restZ);
        context.save();
        context.translate(-bend * beam.half * .28, projectedHeight * .08);
        context.scale(1, .32);
        const refraction = context.createRadialGradient(
          -beam.half * .08, -projectedHeight * .15, 0,
          0, 0, beam.half * .86
        );
        refraction.addColorStop(0, 'rgba(105, 189, 224, .30)');
        refraction.addColorStop(.38, 'rgba(140, 207, 232, .21)');
        refraction.addColorStop(.72, 'rgba(199, 236, 249, .10)');
        refraction.addColorStop(1, 'rgba(199, 236, 249, 0)');
        context.fillStyle = refraction;
        context.fillRect(-nearWidth, -projectedHeight * 4, nearWidth * 2, projectedHeight * 8);
        context.restore();
        const sheen = context.createLinearGradient(-nearWidth / 2, topY, nearWidth / 2, bottomY);
        sheen.addColorStop(0, 'rgba(255, 255, 255, .14)');
        sheen.addColorStop(.45, 'rgba(255, 255, 255, 0)');
        sheen.addColorStop(1, 'rgba(255, 255, 255, .05)');
        context.fillStyle = sheen;
        panelPath();
        context.fill();
        context.restore();

        if (!marble.falling) {
          context.save();
          panelPath();
          context.clip();
          const reflectionY = projectedHeight * .18;
          const reflectionSize = beam.marble * .9;
          const reflectionGlow = context.createRadialGradient(
            marble.place, reflectionY, 0,
            marble.place, reflectionY, reflectionSize * 1.8
          );
          reflectionGlow.addColorStop(0, 'rgba(255, 255, 255, .32)');
          reflectionGlow.addColorStop(.5, 'rgba(176, 216, 228, .12)');
          reflectionGlow.addColorStop(1, 'rgba(176, 216, 228, 0)');
          context.fillStyle = reflectionGlow;
          context.beginPath();
          context.ellipse(marble.place, reflectionY, reflectionSize * 1.5, reflectionSize * .38, 0, 0, Math.PI * 2);
          context.fill();
          if (marbleAssetLoaded && marbleSprite) {
            context.globalAlpha = .22;
            context.translate(marble.place, reflectionY + reflectionSize * .12);
            context.scale(1, -.36);
            context.beginPath();
            context.arc(0, 0, reflectionSize, 0, Math.PI * 2);
            context.clip();
            context.drawImage(marbleSprite, -reflectionSize, -reflectionSize, reflectionSize * 2, reflectionSize * 2);
          }
          context.restore();
        }

        context.lineJoin = 'round';
        context.strokeStyle = 'rgba(255, 255, 255, .55)';
        context.lineWidth = 1.1;
        context.beginPath();
        context.moveTo(-nearWidth / 2, bottomY);
        context.lineTo(-farWidth / 2, topY);
        context.lineTo(farWidth / 2, topY);
        context.lineTo(nearWidth / 2, bottomY);
        context.stroke();
        context.strokeStyle = 'rgba(110, 154, 172, .22)';
        context.lineWidth = .7;
        context.beginPath();
        context.moveTo(-nearWidth / 2, bottomY);
        context.lineTo(-farWidth / 2, topY);
        context.lineTo(farWidth / 2, topY);
        context.lineTo(nearWidth / 2, bottomY);
        context.stroke();

        context.strokeStyle = 'rgba(255, 255, 255, .85)';
        context.lineWidth = 1.1;
        context.beginPath();
        context.moveTo(-farWidth / 2, topY);
        context.lineTo(farWidth / 2, topY);
        context.stroke();
        context.restore();
      }

      function drawPress() {
        if (!press.active) return;
        const point = pointOnBeam(press.place, beam.thickness * .1);
        const pulse = 1 + Math.sin(performance.now() * .004) * .04;
        const radius = beam.marble * (1.3 + press.strength * .25) * pulse;
        const ring = context.createRadialGradient(point.x, point.y, 0, point.x, point.y, radius * 1.7);
        ring.addColorStop(0, 'rgba(75, 104, 114, .12)');
        ring.addColorStop(.58, 'rgba(92, 113, 121, .042)');
        ring.addColorStop(1, 'rgba(92, 113, 121, 0)');
        context.fillStyle = ring;
        context.beginPath();
        context.arc(point.x, point.y, radius * 1.7, 0, Math.PI * 2);
        context.fill();
      }

      function drawMarble() {
        if (!started && !drop.active) return;
        const point = pointOnBeam(marble.place, beam.marble);
        point.y += drop.y;
        const size = beam.marble;
        // 낙하 중에도 구슬의 크기와 카메라 좌표계를 유지한다.
        if (marble.falling) { point.x = marble.airX; point.y = marble.airY; }
        context.save();
        context.translate(point.x, point.y);
        context.rotate(marble.spin);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        if (marbleAssetLoaded && marbleSprite) {
          context.beginPath();
          context.arc(0, 0, size, 0, Math.PI * 2);
          context.clip();
          context.drawImage(marbleSprite, 0, 0, marbleSprite.width, marbleSprite.height, -size, -size, size * 2, size * 2);
        } else {
          const glass = context.createRadialGradient(-size * .28, -size * .32, size * .04, 0, size * .12, size);
          glass.addColorStop(0, 'rgba(255, 255, 255, .95)');
          glass.addColorStop(.2, 'rgba(255, 255, 255, .55)');
          glass.addColorStop(.55, 'rgba(187, 224, 241, .22)');
          glass.addColorStop(.82, 'rgba(142, 203, 231, .28)');
          glass.addColorStop(1, 'rgba(187, 224, 241, .42)');
          context.fillStyle = glass;
          context.beginPath();
          context.arc(0, 0, size, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = 'rgba(255, 255, 255, .78)';
          context.beginPath();
          context.ellipse(-size * .26, -size * .3, size * .2, size * .12, -0.45, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = 'rgba(255, 255, 255, .7)';
          context.beginPath();
          context.arc(-size * .08, size * .18, size * .07, 0, Math.PI * 2);
          context.fill();
          context.beginPath();
          context.arc(size * .12, size * .28, size * .045, 0, Math.PI * 2);
          context.fill();
        }
        context.restore();
      }

      function draw() {
        context.clearRect(0, 0, width, height);
        drawGround();

        drawBeam();
        drawPress();
        drawMarble();
      }

      function respawn() {
        rollingAudio.update(0, false);
        started = false;
        press.active = false;
        press.strength = 0;
        window.dropMarble();
        hint.textContent = '그래도, 다시 굴러옵니다.';
        hint.style.opacity = '.8';
        setStatus('구슬이 위에서 다시 떨어집니다.');
      }

      // 이동 거리에 따라 유리 접촉음을 발생시킨다.
      const rollingAudio = (() => {
        let ctx, lastSpin = null, distance = 0, nextContact = .11;
        function wake() {
          if (!ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            ctx = new AC();
          }
          if (ctx.state === 'suspended') ctx.resume().catch(() => {});
        }
        function update(speed, contact, spin = 0) {
          if (!ctx || ctx.state !== 'running') { lastSpin = null; return; }
          const t = ctx.currentTime;
          if (!contact || document.hidden || Math.abs(speed) < .025) {
            lastSpin = null; distance = 0;
            // 접촉이 끝나도 이미 시작한 소리는 자연스럽게 감쇠한다.
            return;
          }
          if (lastSpin !== null) distance += Math.abs(spin - lastSpin);
          lastSpin = spin;
          if (distance < nextContact) return;
          distance %= nextContact;
          nextContact = .14 + Math.random() * .07;
          const k = Math.min(1, Math.abs(speed) / 2.2);
          // 속도는 음높이 대신 접촉 간격에 반영한다.
          const base = 2180 + Math.sin(spin * .7) * 10 + Math.random() * 6;
          [[1, 1], [2.32, .13], [3.86, .025]].forEach(([ratio, strength]) => {
            const tone = ctx.createOscillator(), g = ctx.createGain();
            tone.type = 'sine';
            tone.frequency.setValueAtTime(base * ratio, t);
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime((.002 + .008 * Math.sqrt(k)) * strength, t + .006);
            g.gain.exponentialRampToValueAtTime(.00001, t + .23 / Math.sqrt(ratio));
            tone.connect(g).connect(ctx.destination);
            tone.start(t);
            tone.stop(t + .25);
            tone.onended = () => { tone.disconnect(); g.disconnect(); };
          });
        }
        ['pointerdown', 'keydown'].forEach(type => window.addEventListener(type, wake, { passive: true }));
        document.addEventListener('visibilitychange', () => update(0, false));
        window.addEventListener('pagehide', () => update(0, false));
        return { update };
      })();

      function animate(now) {
        const elapsed = Math.min(32, now - lastTime);
        lastTime = now;
        const frame = elapsed / 16.67;
        rollingAudio.update(marble.velocity, started && !drop.active && !marble.falling && lift >= 1, marble.spin);

        if (drop.active) {
          drop.vy += 0.62 * frame;
          drop.y += drop.vy * frame;
          if (drop.y >= 0) {
            drop.y = 0;
            const hit = drop.vy;
            try { parent.glassTink?.(hit / 24); } catch (err) { /* standalone */ }
            beam.angle += (marble.place >= 0 ? 1 : -1) * Math.min(0.09, hit * 0.004);
            if (hit > 3.2 && drop.bounces < 3) {
              drop.vy = -hit * 0.34;
              drop.bounces += 1;
            } else {
              drop.active = false;
              drop.vy = 0;
              started = true;
              nudgeDone = true;
              marble.velocity = (marble.place >= 0 ? 1 : -1) * 0.12;
              document.body.classList.add('is-playing');
              setTimeout(() => guideCopy.classList.add('is-gone'), 2600);
            }
          }
          beam.angle *= Math.pow(0.9, frame);
          draw();
          requestAnimationFrame(animate);
          return;
        }

        if (started && lift < 1) {
          lift = Math.min(1, lift + elapsed / 780);
          beam.y = height * (0.78 - 0.27 * lift);
          draw();
          requestAnimationFrame(animate);
          return;
        }

        if (started && !nudgeDone) {
          nudgeDone = true;
          marble.place = (Math.random() - .5) * beam.marble * .45;
          marble.velocity = (Math.random() < .5 ? -1 : 1) * (0.18 + Math.random() * .1);
        }

        if (!started) {
          marble.place = 0;
          marble.velocity = 0;
          marble.falling = 0;
          beam.angle = 0;
          beam.target = 0;
          press.active = false;
          draw();
          requestAnimationFrame(animate);
          return;
        }

        if (!marble.falling) {
          const drift = reducedMotion ? 0 : Math.sin(now * .0011) * .085 + Math.sin(now * .00047 + 1.1) * .04;
          beam.target = press.active ? (press.place / beam.half) * .34 * press.strength : drift;
          const dt = elapsed / 1000;
          beam.angle += (beam.target - beam.angle) * (1 - Math.exp(-7.7 * dt));
          // 미끄러짐 없는 구의 가속도: a = 5/7 g sin(theta).
          const gravity = 1500;
          const angle = beam.angle + beam.restZ;
          let velocity = marble.velocity * 60;
          const downhill = (5 / 7) * gravity * Math.sin(angle);
          const resistance = .004 * gravity * Math.cos(angle);
          const previousVelocity = velocity;
          if (Math.abs(velocity) < .4 && Math.abs(downhill) <= resistance) {
            velocity = 0;
          } else {
            const direction = Math.sign(velocity || downhill);
            velocity += (downhill - direction * resistance) * dt;
            if (Math.sign(velocity) !== direction && Math.abs(downhill) <= resistance) velocity = 0;
            velocity *= Math.exp(-.06 * dt);
          }
          const travel = (previousVelocity + velocity) * .5 * dt;
          marble.velocity = velocity / 60;
          marble.place += travel;
          marble.spin += travel / beam.marble;

          const limit = beam.half * .985;
          if (Math.abs(marble.place) > limit) {
            marble.place = Math.sign(marble.place) * limit;
            marble.direction = Math.sign(marble.place);
            const edge = pointOnBeam(marble.place, beam.marble);
            marble.airX = edge.x;
            marble.airY = edge.y;
            const angle = beam.angle + beam.restZ;
            marble.airVX = marble.velocity * Math.cos(angle) * 60;
            marble.airVY = marble.velocity * Math.sin(angle) * 60;
            marble.falling = .01;
            hint.textContent = '가장자리를 넘었습니다.';
            hint.style.opacity = '.72';
            setStatus('구슬이 시소 끝을 넘어갔습니다. 잠시 후 다시 돌아옵니다.');
          } else if (Math.abs(marble.place) < beam.marble * .8) {
            centeredFor += elapsed;
            if (centeredFor > 2300) {
              hint.textContent = '잠시, 가운데에.';
              hint.style.opacity = '.9';
              setStatus('구슬이 잠시 가운데에 머물고 있습니다.');
            }
          } else {
            centeredFor = 0;
            if (Math.abs(marble.place) > beam.half * .72 && !press.active) {
              setStatus('구슬이 시소 끝 가까이 굴러가고 있습니다.');
            }
          }
        } else {
          const dt = elapsed / 1000;
          marble.falling += dt;
          marble.airX += marble.airVX * dt;
          marble.airY += marble.airVY * dt + .5 * 1500 * dt * dt;
          marble.airVY += 1500 * dt;
          // 모서리를 지나 떨어질 때 판 내부로 구슬이 침투하지 않게 보정한다.
          const angle = beam.angle + beam.restZ;
          const c = Math.cos(angle), sn = Math.sin(angle);
          const dx = marble.airX - beam.x, dy = marble.airY - beam.y;
          const lx = dx * c + dy * sn, ly = -dx * sn + dy * c;
          // 충돌 두께에는 화면에 투영된 판의 원근 깊이를 더하지 않는다.
          const qx = clamp(lx, -beam.half * .985, beam.half * .985);
          const qy = clamp(ly, 0, clamp(beam.thickness * .22, 3, 5));
          const ox = lx - qx, oy = ly - qy, distance = Math.hypot(ox, oy);
          if (distance > .0001 && distance < beam.marble) {
            const nx = ox / distance, ny = oy / distance;
            const correctedX = qx + nx * beam.marble;
            const correctedY = qy + ny * beam.marble;
            marble.airX = beam.x + correctedX * c - correctedY * sn;
            marble.airY = beam.y + correctedX * sn + correctedY * c;
            const worldNX = nx * c - ny * sn, worldNY = nx * sn + ny * c;
            const inward = marble.airVX * worldNX + marble.airVY * worldNY;
            if (inward < 0) {
              marble.airVX -= inward * worldNX;
              marble.airVY -= inward * worldNY;
            }
          }
          marble.spin += marble.velocity * frame / beam.marble;
          if (marble.airY - beam.marble > height + 30) respawn();
        }

        draw();
        requestAnimationFrame(animate);
      }

      window.addEventListener('wheel', (event) => {
        event.preventDefault();
        parent.postMessage({ type: 'blank-marble-wheel', deltaY: event.deltaY }, '*');
      }, { passive: false });

      new ResizeObserver(resize).observe(stage);
      resize();
      requestAnimationFrame(animate);
      window.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.key === ' ') {
          event.preventDefault();
          beginPlay();
        }
      });

      window.startMarble = function () {
        if (!document.body.classList.contains('is-on')) {
          document.body.classList.add('is-on');
        }
        resize();
      };
      window.beginMarble = beginPlay;
      window.dropMarble = function () {
        if (started || drop.active) return;
        lift = 1;
        resize();
        marble.place = (Math.random() < .5 ? -1 : 1) * beam.marble * (0.25 + Math.random() * 0.3);
        marble.velocity = 0;
        marble.falling = 0;
        marble.spin = 0;
        const top = pointOnBeam(marble.place, beam.marble).y;
        drop.y = -(top + beam.marble * 2.2);
        drop.vy = 0;
        drop.bounces = 0;
        drop.active = true;
        stage.focus({ preventScroll: true });
      };
      window.resetMarble = function () {
        rollingAudio.update(0, false);
        started = false;
        lift = 1;
        nudgeDone = false;
        drop.active = false;
        drop.y = 0;
        drop.vy = 0;
        marble.place = 0;
        marble.velocity = 0;
        marble.falling = 0;
        marble.spin = 0;
        beam.angle = 0;
        beam.target = 0;
        press.active = false;
        document.body.classList.remove('is-playing');
        guideCopy.classList.remove('is-gone');
        resize();
      };
    })();
  </script>
</body>
</html>
