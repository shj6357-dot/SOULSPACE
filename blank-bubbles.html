<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soulspace — BURNOUT</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
      :root {
        --font-en: "Butler Stencil", "Noto Serif KR", Georgia, serif;
        --font-ko: "Noto Serif KR", "Butler Stencil", Georgia, serif;
      }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fdf7f5;
            overflow: hidden;
            box-sizing: border-box;
            padding: 8rem 0 calc(max(28px, 5vh) + 3.5rem);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            cursor: default;
        }

        body::before {
            content: "";
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 0;
            width: min(168vmin, 88rem);
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.25);
            pointer-events: none;
            will-change: transform;
            background: radial-gradient(
                circle at 50% 50%,
                #f59580 0%,
                rgba(245, 149, 128, 0.8) 30%,
                rgba(246, 196, 184, 0.3) 55%,
                transparent 74%
            );
        }

        body.is-on::before {
            animation: orbGrow 2.8s ease-out forwards;
        }

        @keyframes orbGrow {
            0% {
                transform: translate(-50%, -50%) scale(0.25);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.12;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='cardGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23cardGrain)'/%3E%3C/svg%3E");
            background-size: 160px 160px;
        }

        .bubble-grid {
            position: relative;
            z-index: 1;
            --room-h: calc(100vh - 8rem - max(28px, 5vh) - 3.5rem);
            width: min(96vw, 1180px, calc(var(--room-h) * 2.1));
            height: min(46vw, 560px, var(--room-h));
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .split-grid {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: inherit;
        }

        .bubble {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            position: relative;
            cursor: pointer;
            border: 0;
            background: transparent;
            isolation: isolate;
            transition: transform .08s ease;
        }
        .bubble::before {
            content: '';
            position: absolute;
            inset: 7%;
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
            background: rgba(240,248,255,.012);
            backdrop-filter: blur(1.5px) saturate(.96) brightness(1.015);
            -webkit-backdrop-filter: blur(1.5px) saturate(.96) brightness(1.015);
            mask-image: radial-gradient(ellipse, #000 58%, transparent 73%);
            -webkit-mask-image: radial-gradient(ellipse, #000 58%, transparent 73%);
        }
        .bubble::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: url('bubble-film-render-clear.png') center / contain no-repeat;
            opacity: .48;
        }
        .bubble:hover { transform: scale(.97); }
        .bubble:active { transform: scale(.93); }

        /* 팡 터질 때의 선명한 링 */
        .burst-ring {
            position: absolute;
            z-index: 2;
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: ringBurst 0.28s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes ringBurst {
            0% { width: 10px; height: 10px; opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            100% { width: 65px; height: 65px; opacity: 0; transform: translate(-50%, -50%) scale(1.7); }
        }

        /* 비산하는 파편 */
        .sparkle-drop {
            position: absolute;
            z-index: 2;
            border-radius: 50%;
            background: #ffffff;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
            animation: dropFly 0.32s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
        }

        @keyframes dropFly {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2);
                opacity: 0;
            }
        }

        .play-layer {
            position: relative;
            z-index: 1;
            opacity: 0.72;
            pointer-events: none;
            transition: opacity 0.9s ease;
        }

        body.is-playing .play-layer {
            opacity: 1;
            pointer-events: auto;
        }

        body.is-replay .play-layer {
            pointer-events: none;
        }

        .done-btn {
            position: fixed;
            left: 50%;
            top: calc(max(24px, env(safe-area-inset-top)) + 4rem);
            bottom: auto;
            z-index: 30;
            transform: translateX(-50%);
            margin: 0;
            padding: 0.62rem 1.55rem;
            border: 0;
            border-radius: 999px;
            background: #f59580;
            color: #fff;
            font-family: var(--font-en);
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.25s ease, background 0.25s ease;
        }

        body.is-playing:not(.is-replay) .done-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .done-btn:hover {
            transform: translateX(-50%) scale(1.05);
        }

        body.is-replay .done-btn {
            opacity: 0;
            pointer-events: none;
        }

        .guide-copy {
            position: fixed;
            left: 50%;
            top: 16%;
            z-index: 20;
            width: min(36rem, 88vw);
            margin: 0;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .guide-copy.is-gone {
            opacity: 0;
            transform: translateX(-50%) translateY(-14px);
        }

        .guide-copy p {
            margin: 0;
            color: #c44832;
            font-family: var(--font-ko);
            font-size: clamp(0.92rem, 1.35vw, 1.12rem);
            line-height: 1.85;
            letter-spacing: -0.025em;
            word-break: keep-all;
        }

        .guide-start {
            margin-top: 1.35rem !important;
            animation: spacePulse 1.55s ease-in-out infinite;
        }

        .guide-start b {
            font-family: var(--font-en);
            font-weight: 700;
        }

        @keyframes spacePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .bubble.is-reborn {
            animation: bubbleReborn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
        }

        @keyframes bubbleReborn {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .key-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.2em;
            height: 1.55em;
            margin: 0 0.2em;
            padding: 0 0.45em;
            border: 1.5px solid currentColor;
            border-radius: 0.4em;
            font-family: var(--font-en);
            font-weight: 500;
            line-height: 1;
        }

        .key-icon.is-space {
            min-width: 3.4em;
            padding-top: 0.15em;
        }

        .guide-copy {
            width: max-content !important;
            max-width: 96vw;
            text-align: center !important;
        }

        .guide-copy {
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
        }

        .guide-copy.is-gone {
            transform: translate(-50%, calc(-50% - 14px)) !important;
        }

        .key-icon {
            vertical-align: middle;
            position: relative;
            top: -0.1em;
        }
      body { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
        @media (max-width: 600px) {
            body { height:100dvh; }
            .bubble-grid {
                width:min(88vw, 440px); height:min(112vw, 58dvh);
                grid-template-columns:repeat(2, minmax(0, 1fr));
                grid-template-rows:repeat(4, minmax(0, 1fr));
                gap:12px;
            }
        }
</style>
    <link rel="stylesheet" href="./fonts/butler-stencil/butler-stencil.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" />
</head>
<body>

    <div class="play-layer">
        <div class="bubble-grid" id="mainGrid"></div>
    </div>
    <div class="guide-copy" id="guideCopy">
        <p>거품을 톡톡 터뜨리며 복잡한 머릿속을 비워보세요.</p>
    </div>
    <button class="done-btn" id="doneBtn" type="button">PLAY BACK</button>

    <script>
        function soundBus(ctx, trim) {
            if (ctx.__bus) return ctx.__bus;
            const input = ctx.createGain();
            input.gain.value = trim;
            const limit = ctx.createDynamicsCompressor();
            limit.threshold.value = -20;
            limit.knee.value = 6;
            limit.ratio.value = 20;
            limit.attack.value = 0.002;
            limit.release.value = 0.15;
            const level = ctx.createGain();
            level.gain.value = 1.4;
            input.connect(limit).connect(level).connect(ctx.destination);
            ctx.__bus = input;
            return input;
        }

        const mainGrid = document.getElementById('mainGrid');
        const guideCopy = document.getElementById('guideCopy');
        const doneBtn = document.getElementById('doneBtn');
        let started = false;
        let replaying = false;
        let popLog = [];
        let playStartedAt = 0;
        let replayTimer = 0;

        function resetGrid() {
            mainGrid.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                mainGrid.appendChild(createBubble(1, String(i)));
            }
        }

        function beginBubbles() {
            if (started || replaying) return;
            started = true;
            playStartedAt = performance.now();
            popLog = [];
            document.body.classList.add('is-on', 'is-playing');
            guideCopy?.classList.add('is-gone');
            doneBtn.textContent = 'PLAY BACK';
            initAudio();
        }

        function waitReplay(ms) {
            return new Promise((resolve) => {
                clearTimeout(replayTimer);
                replayTimer = setTimeout(resolve, ms);
            });
        }

        async function replayPops() {
            if (replaying || !popLog.length) return;
            replaying = true;
            isMouseDown = false;
            document.body.classList.add('is-replay', 'is-playing', 'is-on');
            resetGrid();
            let prev = popLog[0].t;
            await waitReplay(180);
            for (const ev of popLog) {
                if (ev !== popLog[0]) {
                    const wait = Math.min(Math.max((ev.t - prev) / 1.12, 32), 620);
                    await waitReplay(wait);
                }
                if (!replaying) return;
                const bubble = document.querySelector(`[data-path="${ev.path}"]`);
                if (bubble) popBubble(bubble, ev.level, ev.x, ev.y);
                prev = ev.t;
            }
            replaying = false;
            document.body.classList.remove('is-replay');
            doneBtn.textContent = 'RESET';
        }

        function resetAfterLook() {
            if (replaying) return;
            resetGrid();
            popLog = [];
            playStartedAt = performance.now();
            isMouseDown = false;
            doneBtn.textContent = 'PLAY BACK';
        }

        doneBtn.addEventListener('click', () => {
            if (doneBtn.textContent === 'RESET') resetAfterLook();
            else replayPops();
        });

        let isMouseDown = false;
        window.addEventListener('pointerdown', () => { isMouseDown = true; }, true);
        window.addEventListener('pointerup', () => { isMouseDown = false; });
        window.addEventListener('pointercancel', () => { isMouseDown = false; });
        window.addEventListener('blur', () => { isMouseDown = false; });
        let lastDragPoint = null;
        window.addEventListener('pointermove', (event) => {
            if (!isMouseDown || !(event.buttons & 1)) { lastDragPoint = null; return; }
            if (lastDragPoint && Math.hypot(event.clientX-lastDragPoint.x,event.clientY-lastDragPoint.y)<4) return;
            lastDragPoint = {x:event.clientX,y:event.clientY};
            const bubble = document.elementFromPoint(event.clientX,event.clientY)?.closest('.bubble');
            if (bubble) popBubble(bubble, Number(bubble.dataset.level), event.clientX, event.clientY);
        });

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 짧게 내려가는 음으로 압축된 공기가 터지는 울림을 만든다.
        const popBuffers = [];
        function playPopSound(level) {
            if (!audioCtx) return;
            if (!popBuffers.length) {
                for (let variant = 0; variant < 4; variant++) {
                    const rate = audioCtx.sampleRate;
                    const buffer = audioCtx.createBuffer(1, Math.ceil(rate * .085), rate);
                    const data = buffer.getChannelData(0);
                    let low = 0;
                    for (let i = 0; i < data.length; i++) {
                        const t = i / rate;
                        const noise = Math.random() * 2 - 1;
                        low += .14 * (noise - low);
                        const attack = Math.min(1, t / .0015);
                        const crack = (noise - low) * Math.exp(-t / .002) * .008;
                        const pressure = low * Math.exp(-t / .004) * .055;
                        const phase = 2 * Math.PI * ((260 + variant * 10) * t + 270 * .012 * (1 - Math.exp(-t / .012)));
                        const body = Math.sin(phase) * Math.exp(-t / .024) * .8;
                        data[i] = (crack + pressure + body + Math.sin(phase * 2)*Math.exp(-t/.010)*.025) * attack;
                    }
                    popBuffers.push(buffer);
                }
            }
            const source = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            source.buffer = popBuffers[Math.floor(Math.random() * popBuffers.length)];
            gain.gain.value = Math.max(.38, .65 - level * .025);
            source.connect(gain);
            gain.connect(soundBus(audioCtx, .85));
            source.onended = () => { source.disconnect(); gain.disconnect(); };
            source.start();
        }

        function triggerSplash(x, y) {
            const ring = document.createElement('div');
            ring.classList.add('burst-ring');
            ring.style.left = `${x}px`;
            ring.style.top = `${y}px`;
            document.body.appendChild(ring);
            setTimeout(() => ring.remove(), 280);

            const dropCount = 6;
            for (let i = 0; i < dropCount; i++) {
                const drop = document.createElement('div');
                drop.classList.add('sparkle-drop');
                drop.style.left = `${x}px`;
                drop.style.top = `${y}px`;

                const size = Math.random() * 3 + 2.5;
                drop.style.width = `${size}px`;
                drop.style.height = `${size}px`;

                const angle = (Math.PI * 2 / dropCount) * i + (Math.random() * 0.4 - 0.2);
                const distance = Math.random() * 20 + 25;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                drop.style.setProperty('--dx', `${dx}px`);
                drop.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(drop);
                setTimeout(() => drop.remove(), 320);
            }
        }

        // 공통 터뜨림 핸들러
        function popBubble(bubble, level, clientX, clientY) {
            if ((!started && !replaying) || !bubble.parentElement) return;

            const path = bubble.dataset.path;
            if (!replaying && path) {
                popLog.push({
                    t: performance.now() - playStartedAt,
                    path,
                    level,
                    x: clientX,
                    y: clientY,
                });
            }

            initAudio();
            playPopSound(level);
            triggerSplash(clientX, clientY);

            const splitGrid = document.createElement('div');
            splitGrid.classList.add('split-grid');
            
            const nextGap = Math.max(1, Math.round(20 / Math.pow(1.6, level)));
            splitGrid.style.gap = `${nextGap}px`;

            for (let i = 0; i < 4; i++) {
                splitGrid.appendChild(createBubble(level + 1, path ? `${path}-${i}` : String(i)));
            }

            bubble.replaceWith(splitGrid);
        }

        function createBubble(level, path) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.dataset.level = level;
            bubble.style.touchAction = 'none';
            if (path != null) bubble.dataset.path = path;
            if (level >= 4) {
                bubble.classList.add('micro');
            }

            bubble.addEventListener('pointerdown', function(e) {
                if (e.button !== 0) return;
                e.preventDefault();
                popBubble(bubble, level, e.clientX, e.clientY);
            });

            return bubble;
        }

        resetGrid();

        window.stopBubbles = function () {
            replaying = false;
            clearTimeout(replayTimer);
            started = false;
            popLog = [];
            isMouseDown = false;
            document.body.classList.remove('is-on', 'is-playing', 'is-replay');
            guideCopy?.classList.remove('is-gone');
            doneBtn.textContent = 'PLAY BACK';
            resetGrid();
            if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
        };

        window.startBubbles = function () {
            if (!document.body.classList.contains('is-on')) {
                document.body.classList.add('is-on');
            }
        };

        window.beginBubbles = beginBubbles;

        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space' || event.key === ' ') {
                event.preventDefault();
                beginBubbles();
            }
        });

        window.addEventListener('wheel', (event) => {
            event.preventDefault();
            parent.postMessage({ type: 'card-interact-wheel', deltaY: event.deltaY }, '*');
        }, { passive: false });
    </script>
</body>
</html>
