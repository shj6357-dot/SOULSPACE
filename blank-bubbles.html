<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soulspace — BURNOUT</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fdf7f5;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            cursor: default;
        }

        body::before {
            content: "";
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 0;
            width: min(42vmin, 24.5rem);
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(10px);
            background: radial-gradient(
                circle at 50% 50%,
                #f59580 0%,
                rgba(245, 149, 128, 0.8) 38%,
                rgba(246, 196, 184, 0.3) 64%,
                transparent 78%
            );
        }

        body.is-on::before {
            animation: orbGrow 2.8s ease-out forwards;
        }

        @keyframes orbGrow {
            0% {
                width: min(42vmin, 24.5rem);
                filter: blur(10px);
            }
            100% {
                width: min(168vmin, 88rem);
                filter: blur(64px);
            }
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.12;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='cardGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23cardGrain)'/%3E%3C/svg%3E");
            background-size: 160px 160px;
        }

        .bubble-grid {
            position: relative;
            z-index: 1;
            width: min(96vw, 1180px);
            height: min(46vw, 560px);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            padding: 10px;
        }

        .split-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: inherit;
        }

        .bubble {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, 
                rgba(255, 255, 255, 0.6) 0%, 
                rgba(255, 255, 255, 0.2) 30%, 
                rgba(255, 255, 255, 0.02) 65%, 
                rgba(0, 50, 80, 0.1) 88%, 
                rgba(255, 255, 255, 0.5) 100%);
            box-shadow: 
                inset 0 0 10px rgba(255, 255, 255, 0.65),
                inset -2px -2px 6px rgba(0, 40, 70, 0.12),
                inset 2px 2px 6px rgba(255, 255, 255, 0.9),
                0 8px 20px rgba(0, 40, 70, 0.1);
            transition: transform 0.06s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 14%;
            left: 20%;
            width: 32%;
            height: 22%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 70%);
            transform: rotate(-25deg);
            pointer-events: none;
        }

        .bubble::after {
            content: '';
            position: absolute;
            bottom: 12%;
            right: 18%;
            width: 45%;
            height: 25%;
            border-radius: 50%;
            border-bottom: 2.5px solid rgba(255, 255, 255, 0.85);
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .bubble:hover {
            transform: scale(1.03);
        }

        .bubble.micro {
            box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.9), 0 0 3px rgba(0, 40, 70, 0.15);
        }
        .bubble.micro::before,
        .bubble.micro::after {
            display: none;
        }

        /* 팡 터질 때의 선명한 링 */
        .burst-ring {
            position: absolute;
            z-index: 2;
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: ringBurst 0.28s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes ringBurst {
            0% { width: 10px; height: 10px; opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            100% { width: 65px; height: 65px; opacity: 0; transform: translate(-50%, -50%) scale(1.7); }
        }

        /* 비산하는 파편 */
        .sparkle-drop {
            position: absolute;
            z-index: 2;
            border-radius: 50%;
            background: #ffffff;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
            animation: dropFly 0.32s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
        }

        @keyframes dropFly {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2);
                opacity: 0;
            }
        }

        .play-layer {
            position: relative;
            z-index: 1;
            filter: blur(3.5px);
            opacity: 0.72;
            pointer-events: none;
            transition: filter 0.9s ease, opacity 0.9s ease;
        }

        body.is-playing .play-layer {
            filter: blur(0);
            opacity: 1;
            pointer-events: auto;
        }

        body.is-replay .play-layer {
            pointer-events: none;
        }

        .done-btn {
            position: static;
            transform: none;
            margin: 0;
            padding: 0.62rem 1.55rem;
            border: 0;
            border-radius: 999px;
            background: #f59580;
            color: #fff;
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.25s ease, background 0.25s ease;
        }

        .action-row {
            position: fixed;
            left: 50%;
            bottom: 1.8rem;
            z-index: 30;
            display: flex;
            gap: .65rem;
            transform: translateX(-50%);
        }

        .reset-btn {
            margin: 0;
            min-width: 7.4rem;
            padding: .72rem 1.35rem;
            border: 1px solid rgba(134,72,60,.2);
            border-radius: 999px;
            background: rgba(255,248,245,.78);
            color: #8a4d42;
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: .04em;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 12px 28px rgba(130,67,55,.1), inset 0 1px 0 rgba(255,255,255,.8);
            backdrop-filter: blur(10px);
        }

        body.is-playing:not(.is-replay) .done-btn,
        body.is-playing .reset-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .done-btn:hover {
            transform: scale(1.04);
        }

        body.is-replay .done-btn {
            opacity: 0;
            pointer-events: none;
        }

        .guide-copy {
            position: fixed;
            left: 50%;
            top: 16%;
            z-index: 20;
            width: min(36rem, 88vw);
            margin: 0;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .guide-copy.is-gone {
            opacity: 0;
            transform: translateX(-50%) translateY(-14px);
        }

        .guide-copy p {
            margin: 0;
            color: #c44832;
            font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            font-size: clamp(0.92rem, 1.35vw, 1.12rem);
            line-height: 1.85;
            letter-spacing: -0.025em;
            word-break: keep-all;
        }

        .guide-start {
            margin-top: 1.35rem !important;
            animation: spacePulse 1.55s ease-in-out infinite;
        }

        .guide-start b {
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            font-weight: 700;
        }

        @keyframes spacePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        /* S — 거품의 입체감과 행동 안내의 가독성 강화 */
        body {
            background:
                radial-gradient(ellipse 68% 58% at 50% 48%, rgba(244,184,169,.27), transparent 72%),
                linear-gradient(180deg, #fffaf8 0%, #f8ece8 100%);
        }

        .interaction-caption {
            position: fixed;
            left: 50%;
            top: clamp(4.6rem, 9vh, 6.8rem);
            z-index: 24;
            width: min(39rem, 86vw);
            margin: 0;
            transform: translateX(-50%);
            color: #844c43;
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            font-size: clamp(.88rem, 1.08vw, 1rem);
            font-weight: 500;
            line-height: 1.7;
            letter-spacing: -.02em;
            text-align: center;
            text-shadow: 0 1px 12px rgba(255,255,255,.94);
            pointer-events: none;
        }

        .bubble-grid {
            width: min(88vw, 1080px);
            height: min(43vw, 520px);
            gap: 18px;
            padding: 18px;
            border: 1px solid rgba(164,91,76,.12);
            border-radius: 38% 62% 46% 54% / 56% 42% 58% 44%;
            background: radial-gradient(ellipse, rgba(255,255,255,.24), rgba(249,220,213,.07) 62%, transparent 82%);
            box-shadow: inset 0 0 64px rgba(255,255,255,.34), 0 26px 68px rgba(143,75,62,.06);
        }

        .bubble {
            border: 1px solid rgba(135,77,67,.22);
            background: radial-gradient(circle at 34% 32%,
                rgba(255,255,255,.88) 0%,
                rgba(255,255,255,.34) 27%,
                rgba(250,201,190,.14) 62%,
                rgba(147,79,68,.12) 86%,
                rgba(255,255,255,.58) 100%);
            box-shadow:
                inset 0 0 12px rgba(255,255,255,.82),
                inset -3px -3px 9px rgba(120,64,55,.15),
                inset 3px 3px 8px rgba(255,255,255,.92),
                0 10px 24px rgba(118,63,52,.13);
        }

        .bubble:hover {
            transform: scale(1.025);
            border-color: rgba(125,68,58,.34);
            box-shadow:
                inset 0 0 14px rgba(255,255,255,.9),
                inset -3px -3px 9px rgba(120,64,55,.16),
                0 13px 30px rgba(118,63,52,.17);
        }

        .done-btn {
            bottom: auto;
            min-width: 8.7rem;
            padding: .72rem 1.45rem;
            border: 1px solid rgba(134,72,60,.2);
            background: rgba(170,82,65,.88);
            box-shadow: 0 12px 30px rgba(130,67,55,.18), inset 0 1px 0 rgba(255,255,255,.26);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
            font-size: .82rem;
            letter-spacing: .08em;
        }

        @media (max-height: 700px) {
            .interaction-caption { top: 4rem; }
            .bubble-grid { height: min(40vw, 440px); }
        }

        /* U — 거품이 아닌 압력의 막이 서서히 느슨해지는 장면 */
        body {
            --release: 0;
            --release-alpha: .32;
            --release-overlay: .18;
            --release-field-scale: 1;
            --release-membrane-scale: 1;
            --release-membrane-opacity: .76;
            --release-grid-scale: 1;
            --release-inset: 64px;
            background:
                radial-gradient(ellipse 62% 52% at 50% 48%, rgba(241,151,132,var(--release-alpha)), transparent 72%),
                linear-gradient(180deg, #fffaf8 0%, #f8ece8 100%);
        }

        body::after {
            opacity: var(--release-overlay);
            mix-blend-mode: multiply;
            background:
                repeating-radial-gradient(ellipse at 50% 50%, transparent 0 66px, rgba(154,76,61,.08) 67px 68px, transparent 69px 126px),
                radial-gradient(ellipse at center, transparent 35%, rgba(164,80,64,.1) 78%, rgba(129,58,47,.12) 100%);
            transform: scale(var(--release-field-scale));
            transition: opacity .9s ease, transform 1.4s ease;
        }

        .pressure-field {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 0;
            width: min(78vw, 980px);
            height: min(58vw, 650px);
            transform: translate(-50%, -50%) scale(var(--release-membrane-scale));
            border: 1px solid rgba(164,86,72,.1);
            border-radius: 45% 55% 48% 52% / 54% 44% 56% 46%;
            box-shadow: 0 0 0 42px rgba(221,135,116,.035), 0 0 0 96px rgba(221,135,116,.022), inset 0 0 94px rgba(182,91,74,.055);
            opacity: var(--release-membrane-opacity);
            pointer-events: none;
            transition: transform 1.2s ease, opacity 1.2s ease, border-radius 1.2s ease;
            animation: pressureBreathe 6s ease-in-out infinite alternate;
        }

        @keyframes pressureBreathe {
            from { border-radius: 45% 55% 48% 52% / 54% 44% 56% 46%; }
            to { border-radius: 53% 47% 56% 44% / 46% 55% 45% 54%; }
        }

        .bubble-grid {
            transition: transform 1.1s ease, box-shadow 1.1s ease, border-radius 1.1s ease;
            transform: scale(var(--release-grid-scale));
            box-shadow: inset 0 0 var(--release-inset) rgba(255,255,255,.38), 0 26px 68px rgba(143,75,62,.06);
        }

        .burst-ring {
            border-color: rgba(255,255,255,.9);
            animation-duration: .72s;
        }

        @keyframes ringBurst {
            0% { width: 12px; height: 12px; opacity: .9; transform: translate(-50%, -50%) scale(.5); }
            100% { width: 150px; height: 150px; opacity: 0; transform: translate(-50%, -50%) scale(1.35); }
        }
body { background:linear-gradient(145deg,#fffaf8 12%,#f4ded7 48%,#fcf0eb 74%,#f0d6d0); }
    body::before,.pressure-field { display:none; }
    body::after { background:linear-gradient(120deg,transparent 22%,rgba(255,255,255,.86) 43%,rgba(212,139,120,.24) 70%,transparent 88%); filter:blur(36px); opacity:var(--release-overlay); mix-blend-mode:normal; }
    .bubble-grid { border:0; border-radius:0; background:transparent; box-shadow:none; }

      body { height:100svh; }
      .bubble-grid { width:88vw; height:44vw; max-height:13rem; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr); gap:8px; padding:4px; }
      .bubble { touch-action:none; }

      .action-row { bottom:max(12px,env(safe-area-inset-bottom)); }
      .done-btn,.reset-btn { min-height:44px; }
    }
    @media(max-width:767px) {
      body::after { filter:blur(15px); opacity:var(--release-overlay); }
      .bubble-grid { width:84vw; height:42vw; max-height:11.5rem; gap:7px; }

      .action-row { gap:8px; }
    }
  </style>

<body>

    <div class="pressure-field" aria-hidden="true"></div>
    <div class="play-layer">
        <div class="bubble-grid" id="mainGrid"></div>
    </div>
    <p class="interaction-caption">마음에 쌓인 압박을 떠올리며, 거품을 하나씩 천천히 터뜨려 보세요.</p>
    <div class="guide-copy" id="guideCopy">
          <p>거품을 하나씩 터뜨리며, 쌓인 압박을 천천히 풀어보세요.</p>
        <p class="guide-start"><b>Space</b> 를 누르면 시작됩니다.</p>
    </div>
    <div class="action-row">
        <button class="reset-btn" id="resetBtn" type="button">처음부터</button>
        <button class="done-btn" id="doneBtn" type="button">흔적 보기</button>
    </div>

    <script>
        const mainGrid = document.getElementById('mainGrid');
        const guideCopy = document.getElementById('guideCopy');
        const doneBtn = document.getElementById('doneBtn');
        const resetBtn = document.getElementById('resetBtn');
        let started = false;
        let replaying = false;
        let popLog = [];
        let playStartedAt = 0;
        let replayTimer = 0;
        let lastDragPopAt = 0;
        const MAX_LEVEL = 2;
        const MAX_LOG = 120;
        let releasedPressure = 0;

        function syncRelease() {
            const release = Math.min(1, releasedPressure / 34);
            document.body.style.setProperty('--release', release.toFixed(3));
            document.body.style.setProperty('--release-alpha', (.32 - release * .18).toFixed(3));
            document.body.style.setProperty('--release-overlay', (.18 - release * .08).toFixed(3));
            document.body.style.setProperty('--release-field-scale', (1 - release * .035).toFixed(3));
            document.body.style.setProperty('--release-membrane-scale', (1 - release * .08).toFixed(3));
            document.body.style.setProperty('--release-membrane-opacity', (.76 - release * .34).toFixed(3));
            document.body.style.setProperty('--release-grid-scale', (1 - release * .025).toFixed(3));
            document.body.style.setProperty('--release-inset', `${64 + release * 34}px`);
        }

        function resetGrid() {
            mainGrid.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                mainGrid.appendChild(createBubble(1, String(i)));
            }
            releasedPressure = 0;
            syncRelease();
        }

        function beginBubbles() {
            if (started || replaying) return;
            started = true;
            playStartedAt = performance.now();
            popLog = [];
            document.body.classList.add('is-on', 'is-playing');
            guideCopy?.classList.add('is-gone');
            doneBtn.textContent = '흔적 보기';
            initAudio();
        }

        function waitReplay(ms) {
            return new Promise((resolve) => {
                clearTimeout(replayTimer);
                replayTimer = setTimeout(resolve, ms);
            });
        }

        async function replayPops() {
            if (replaying || !popLog.length) return;
            replaying = true;
            isMouseDown = false;
            document.body.classList.add('is-replay', 'is-playing', 'is-on');
            resetGrid();
            let prev = popLog[0].t;
            await waitReplay(180);
            for (const ev of popLog) {
                if (ev !== popLog[0]) {
                    const wait = Math.min(Math.max((ev.t - prev) / 1.12, 32), 620);
                    await waitReplay(wait);
                }
                if (!replaying) return;
                const bubble = document.querySelector(`[data-path="${ev.path}"]`);
                if (bubble) popBubble(bubble, ev.level, ev.x, ev.y);
                prev = ev.t;
            }
            replaying = false;
            document.body.classList.remove('is-replay');
            doneBtn.textContent = '다시 시작';
        }

        function resetAfterLook() {
            replaying = false;
            clearTimeout(replayTimer);
            document.body.classList.remove('is-replay');
            resetGrid();
            popLog = [];
            playStartedAt = performance.now();
            isMouseDown = false;
            doneBtn.textContent = '흔적 보기';
        }

        doneBtn.addEventListener('click', () => {
            if (doneBtn.textContent === '다시 시작') resetAfterLook();
            else replayPops();
        });
        resetBtn.addEventListener('click', resetAfterLook);

        let isMouseDown = false;
        window.addEventListener('pointerdown', () => { isMouseDown = true; });
        window.addEventListener('pointerup', () => { isMouseDown = false; });
        window.addEventListener('pointercancel', () => { isMouseDown = false; });

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 이전의 부드럽고 맑은 고유 ASMR 팝 사운드 복원
        function playPopSound(level) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const now = audioCtx.currentTime;

            osc.type = 'sine';

            const baseFreq = Math.min(5000, 240 * Math.pow(1.28, level));
            const randomPitch = baseFreq + (Math.random() * 30 - 15);

            osc.frequency.setValueAtTime(randomPitch, now);
            osc.frequency.exponentialRampToValueAtTime(randomPitch * 1.5, now + 0.03);

            const duration = Math.max(0.04, 0.08 - level * 0.005);
            const volume = Math.max(0.035, 0.105 - level * 0.012);

            gainNode.gain.setValueAtTime(volume, now);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + duration);
        }

        function triggerSplash(x, y) {
            const ring = document.createElement('div');
            ring.classList.add('burst-ring');
            ring.style.left = `${x}px`;
            ring.style.top = `${y}px`;
            document.body.appendChild(ring);
            setTimeout(() => ring.remove(), 760);

            const dropCount = 1;
            for (let i = 0; i < dropCount; i++) {
                const drop = document.createElement('div');
                drop.classList.add('sparkle-drop');
                drop.style.left = `${x}px`;
                drop.style.top = `${y}px`;

                const size = Math.random() * 3 + 2.5;
                drop.style.width = `${size}px`;
                drop.style.height = `${size}px`;

                const angle = (Math.PI * 2 / dropCount) * i + (Math.random() * 0.4 - 0.2);
                const distance = Math.random() * 20 + 25;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                drop.style.setProperty('--dx', `${dx}px`);
                drop.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(drop);
                setTimeout(() => drop.remove(), 320);
            }
        }

        // 공통 터뜨림 핸들러
        function popBubble(bubble, level, clientX, clientY) {
            if ((!started && !replaying) || !bubble.parentElement) return;

            const path = bubble.dataset.path;
            if (!replaying && path) {
                popLog.push({
                    t: performance.now() - playStartedAt,
                    path,
                    level,
                    x: clientX,
                    y: clientY,
                });
                if (popLog.length > MAX_LOG) popLog.shift();
            }

            initAudio();
            playPopSound(level);
            triggerSplash(clientX, clientY);
            releasedPressure += level === 1 ? 1.4 : 1;
            syncRelease();

            if (level >= MAX_LEVEL) {
                bubble.classList.add('is-popped');
                bubble.style.pointerEvents = 'none';
                bubble.animate([
                    { opacity: 1, transform: 'scale(1)' },
                    { opacity: 0, transform: 'scale(.72)' }
                ], { duration: 220, easing: 'ease-out', fill: 'forwards' });
                setTimeout(() => bubble.remove(), 230);
                return;
            }

            const splitGrid = document.createElement('div');
            splitGrid.classList.add('split-grid');
            
            const nextGap = Math.max(1, Math.round(20 / Math.pow(1.6, level)));
            splitGrid.style.gap = `${nextGap}px`;

            for (let i = 0; i < 4; i++) {
                splitGrid.appendChild(createBubble(level + 1, path ? `${path}-${i}` : String(i)));
            }

            bubble.replaceWith(splitGrid);
        }

        function createBubble(level, path) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            if (path != null) bubble.dataset.path = path;
            if (level >= 4) {
                bubble.classList.add('micro');
            }

            bubble.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                popBubble(bubble, level, e.clientX, e.clientY);
            });

            bubble.addEventListener('pointerenter', function(e) {
                if (isMouseDown && e.pointerType === 'mouse') {
                    const now = performance.now();
                    if (now - lastDragPopAt < 42) return;
                    lastDragPopAt = now;
                    popBubble(bubble, level, e.clientX, e.clientY);
                }
            });

            return bubble;
        }

        resetGrid();

        window.stopBubbles = function () {
            replaying = false;
            clearTimeout(replayTimer);
            started = false;
            popLog = [];
            isMouseDown = false;
            document.body.classList.remove('is-on', 'is-playing', 'is-replay');
            guideCopy?.classList.remove('is-gone');
            doneBtn.textContent = '흔적 보기';
            lastDragPopAt = 0;
            releasedPressure = 0;
            syncRelease();
            resetGrid();
            if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
        };

        window.startBubbles = function () {
            if (!document.body.classList.contains('is-on')) {
                document.body.classList.add('is-on');
            }
        };

        window.beginBubbles = beginBubbles;

        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space' || event.key === ' ') {
                event.preventDefault();
                beginBubbles();
            }
        });

        window.addEventListener('wheel', (event) => {
            event.preventDefault();
            parent.postMessage({ type: 'card-interact-wheel', deltaY: event.deltaY }, '*');
        }, { passive: false });
    </script>
</body>
</html>
