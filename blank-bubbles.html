<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soulspace — BURNOUT</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fdf7f5;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            cursor: default;
        }

        body::before {
            content: "";
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 0;
            width: min(42vmin, 24.5rem);
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(10px);
            background: radial-gradient(
                circle at 50% 50%,
                #f59580 0%,
                rgba(245, 149, 128, 0.8) 38%,
                rgba(246, 196, 184, 0.3) 64%,
                transparent 78%
            );
        }

        body.is-on::before {
            animation: orbGrow 2.8s ease-out forwards;
        }

        @keyframes orbGrow {
            0% {
                width: min(42vmin, 24.5rem);
                filter: blur(10px);
            }
            100% {
                width: min(168vmin, 88rem);
                filter: blur(64px);
            }
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.12;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='cardGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23cardGrain)'/%3E%3C/svg%3E");
            background-size: 160px 160px;
        }

        .bubble-grid {
            position: relative;
            z-index: 1;
            width: min(96vw, 1180px);
            height: min(46vw, 560px);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            padding: 10px;
        }

        .split-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: inherit;
        }

        .bubble {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, 
                rgba(255, 255, 255, 0.6) 0%, 
                rgba(255, 255, 255, 0.2) 30%, 
                rgba(255, 255, 255, 0.02) 65%, 
                rgba(0, 50, 80, 0.1) 88%, 
                rgba(255, 255, 255, 0.5) 100%);
            box-shadow: 
                inset 0 0 10px rgba(255, 255, 255, 0.65),
                inset -2px -2px 6px rgba(0, 40, 70, 0.12),
                inset 2px 2px 6px rgba(255, 255, 255, 0.9),
                0 8px 20px rgba(0, 40, 70, 0.1);
            transition: transform 0.06s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 14%;
            left: 20%;
            width: 32%;
            height: 22%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 70%);
            transform: rotate(-25deg);
            pointer-events: none;
        }

        .bubble::after {
            content: '';
            position: absolute;
            bottom: 12%;
            right: 18%;
            width: 45%;
            height: 25%;
            border-radius: 50%;
            border-bottom: 2.5px solid rgba(255, 255, 255, 0.85);
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .bubble:hover {
            transform: scale(1.03);
        }

        .bubble.micro {
            box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.9), 0 0 3px rgba(0, 40, 70, 0.15);
        }
        .bubble.micro::before,
        .bubble.micro::after {
            display: none;
        }

        /* 팡 터질 때의 선명한 링 */
        .burst-ring {
            position: absolute;
            z-index: 2;
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: ringBurst 0.28s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes ringBurst {
            0% { width: 10px; height: 10px; opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            100% { width: 65px; height: 65px; opacity: 0; transform: translate(-50%, -50%) scale(1.7); }
        }

        /* 비산하는 파편 */
        .sparkle-drop {
            position: absolute;
            z-index: 2;
            border-radius: 50%;
            background: #ffffff;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
            animation: dropFly 0.32s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
        }

        @keyframes dropFly {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2);
                opacity: 0;
            }
        }

        .play-layer {
            position: relative;
            z-index: 1;
            filter: blur(3.5px);
            opacity: 0.72;
            pointer-events: none;
            transition: filter 0.9s ease, opacity 0.9s ease;
        }

        body.is-playing .play-layer {
            filter: blur(0);
            opacity: 1;
            pointer-events: auto;
        }

        body.is-replay .play-layer {
            pointer-events: none;
        }

        .done-btn {
            position: fixed;
            left: 50%;
            bottom: 2.35rem;
            z-index: 30;
            transform: translateX(-50%);
            margin: 0;
            padding: 0.62rem 1.55rem;
            border: 0;
            border-radius: 999px;
            background: #f59580;
            color: #fff;
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.25s ease, background 0.25s ease;
        }

        body.is-playing:not(.is-replay) .done-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .done-btn:hover {
            transform: translateX(-50%) scale(1.05);
        }

        body.is-replay .done-btn {
            opacity: 0;
            pointer-events: none;
        }

        .guide-copy {
            position: fixed;
            left: 50%;
            top: 16%;
            z-index: 20;
            width: min(36rem, 88vw);
            margin: 0;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .guide-copy.is-gone {
            opacity: 0;
            transform: translateX(-50%) translateY(-14px);
        }

        .guide-copy p {
            margin: 0;
            color: #c44832;
            font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            font-size: clamp(0.92rem, 1.35vw, 1.12rem);
            line-height: 1.85;
            letter-spacing: -0.025em;
            word-break: keep-all;
        }

        .guide-start {
            margin-top: 1.35rem !important;
            animation: spacePulse 1.55s ease-in-out infinite;
        }

        .guide-start b {
            font-family: Montserrat, "Helvetica Neue", sans-serif;
            font-weight: 700;
        }

        @keyframes spacePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
    </style>
</head>
<body>

    <div class="play-layer">
        <div class="bubble-grid" id="mainGrid"></div>
    </div>
    <div class="guide-copy" id="guideCopy">
        <p>거품을 톡톡 터뜨리며 복잡한 머릿속을 비워보세요.</p>
        <p class="guide-start"><b>Space</b> 를 누르면 시작됩니다.</p>
    </div>
    <button class="done-btn" id="doneBtn" type="button">LOOK IN</button>

    <script>
        const mainGrid = document.getElementById('mainGrid');
        const guideCopy = document.getElementById('guideCopy');
        const doneBtn = document.getElementById('doneBtn');
        let started = false;
        let replaying = false;
        let popLog = [];
        let playStartedAt = 0;
        let replayTimer = 0;

        function resetGrid() {
            mainGrid.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                mainGrid.appendChild(createBubble(1, String(i)));
            }
        }

        function beginBubbles() {
            if (started || replaying) return;
            started = true;
            playStartedAt = performance.now();
            popLog = [];
            document.body.classList.add('is-on', 'is-playing');
            guideCopy?.classList.add('is-gone');
            doneBtn.textContent = 'LOOK IN';
            initAudio();
        }

        function waitReplay(ms) {
            return new Promise((resolve) => {
                clearTimeout(replayTimer);
                replayTimer = setTimeout(resolve, ms);
            });
        }

        async function replayPops() {
            if (replaying || !popLog.length) return;
            replaying = true;
            isMouseDown = false;
            document.body.classList.add('is-replay', 'is-playing', 'is-on');
            resetGrid();
            let prev = popLog[0].t;
            await waitReplay(180);
            for (const ev of popLog) {
                if (ev !== popLog[0]) {
                    const wait = Math.min(Math.max((ev.t - prev) / 1.12, 32), 620);
                    await waitReplay(wait);
                }
                if (!replaying) return;
                const bubble = document.querySelector(`[data-path="${ev.path}"]`);
                if (bubble) popBubble(bubble, ev.level, ev.x, ev.y);
                prev = ev.t;
            }
            replaying = false;
            document.body.classList.remove('is-replay');
            doneBtn.textContent = 'RESET';
        }

        function resetAfterLook() {
            if (replaying) return;
            resetGrid();
            popLog = [];
            playStartedAt = performance.now();
            isMouseDown = false;
            doneBtn.textContent = 'LOOK IN';
        }

        doneBtn.addEventListener('click', () => {
            if (doneBtn.textContent === 'RESET') resetAfterLook();
            else replayPops();
        });

        let isMouseDown = false;
        window.addEventListener('mousedown', () => { isMouseDown = true; });
        window.addEventListener('mouseup', () => { isMouseDown = false; });

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 이전의 부드럽고 맑은 고유 ASMR 팝 사운드 복원
        function playPopSound(level) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const now = audioCtx.currentTime;

            osc.type = 'sine';

            const baseFreq = Math.min(5000, 240 * Math.pow(1.28, level));
            const randomPitch = baseFreq + (Math.random() * 30 - 15);

            osc.frequency.setValueAtTime(randomPitch, now);
            osc.frequency.exponentialRampToValueAtTime(randomPitch * 1.5, now + 0.03);

            const duration = Math.max(0.04, 0.08 - level * 0.005);
            const volume = Math.max(0.06, 0.18 - level * 0.01);

            gainNode.gain.setValueAtTime(volume, now);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + duration);
        }

        function triggerSplash(x, y) {
            const ring = document.createElement('div');
            ring.classList.add('burst-ring');
            ring.style.left = `${x}px`;
            ring.style.top = `${y}px`;
            document.body.appendChild(ring);
            setTimeout(() => ring.remove(), 280);

            const dropCount = 6;
            for (let i = 0; i < dropCount; i++) {
                const drop = document.createElement('div');
                drop.classList.add('sparkle-drop');
                drop.style.left = `${x}px`;
                drop.style.top = `${y}px`;

                const size = Math.random() * 3 + 2.5;
                drop.style.width = `${size}px`;
                drop.style.height = `${size}px`;

                const angle = (Math.PI * 2 / dropCount) * i + (Math.random() * 0.4 - 0.2);
                const distance = Math.random() * 20 + 25;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                drop.style.setProperty('--dx', `${dx}px`);
                drop.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(drop);
                setTimeout(() => drop.remove(), 320);
            }
        }

        // 공통 터뜨림 핸들러
        function popBubble(bubble, level, clientX, clientY) {
            if ((!started && !replaying) || !bubble.parentElement) return;

            const path = bubble.dataset.path;
            if (!replaying && path) {
                popLog.push({
                    t: performance.now() - playStartedAt,
                    path,
                    level,
                    x: clientX,
                    y: clientY,
                });
            }

            initAudio();
            playPopSound(level);
            triggerSplash(clientX, clientY);

            const splitGrid = document.createElement('div');
            splitGrid.classList.add('split-grid');
            
            const nextGap = Math.max(1, Math.round(20 / Math.pow(1.6, level)));
            splitGrid.style.gap = `${nextGap}px`;

            for (let i = 0; i < 4; i++) {
                splitGrid.appendChild(createBubble(level + 1, path ? `${path}-${i}` : String(i)));
            }

            bubble.replaceWith(splitGrid);
        }

        function createBubble(level, path) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            if (path != null) bubble.dataset.path = path;
            if (level >= 4) {
                bubble.classList.add('micro');
            }

            bubble.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                popBubble(bubble, level, e.clientX, e.clientY);
            });

            bubble.addEventListener('mouseenter', function(e) {
                if (isMouseDown) {
                    popBubble(bubble, level, e.clientX, e.clientY);
                }
            });

            return bubble;
        }

        resetGrid();

        window.stopBubbles = function () {
            replaying = false;
            clearTimeout(replayTimer);
            started = false;
            popLog = [];
            isMouseDown = false;
            document.body.classList.remove('is-on', 'is-playing', 'is-replay');
            guideCopy?.classList.remove('is-gone');
            doneBtn.textContent = 'LOOK IN';
            resetGrid();
            if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
        };

        window.startBubbles = function () {
            if (!document.body.classList.contains('is-on')) {
                document.body.classList.add('is-on');
            }
        };

        window.beginBubbles = beginBubbles;

        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space' || event.key === ' ') {
                event.preventDefault();
                beginBubbles();
            }
        });

        window.addEventListener('wheel', (event) => {
            event.preventDefault();
            parent.postMessage({ type: 'card-interact-wheel', deltaY: event.deltaY }, '*');
        }, { passive: false });
    </script>
</body>
</html>
